name = "universal-duels-test"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "EDITOR_DRAFTS"
id = "453d2d63210e42149663b5771e76a803"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/editor-api/*"]

[vars]
ACCESS_TEAM_DOMAIN = "TU_EQUIPO.cloudflareaccess.com"
ACCESS_AUD = "TU_AUD_DEL_WORKER_DE_PRUEBAS"
EDITOR_EMAIL = "TU_CORREO_AUTORIZADO"
