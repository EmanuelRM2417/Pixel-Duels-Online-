name = "universal-duels-test"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "EDITOR_DRAFTS"
id = "PEGA_AQUI_EL_NAMESPACE_ID_DE_PRUEBAS"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/editor-api/*"]

[vars]
ACCESS_TEAM_DOMAIN = "TU_EQUIPO.cloudflareaccess.com"
ACCESS_AUD = "TU_AUD_DEL_WORKER_DE_PRUEBAS"
EDITOR_EMAIL = "TU_CORREO_AUTORIZADO"
