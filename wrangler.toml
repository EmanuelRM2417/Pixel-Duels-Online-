name = "duelo-pixel-rooms"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "EDITOR_DRAFTS"
id = "1173494a63814d1b9093b9a409cf2832"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]
