name = "duelo-pixel-rooms"
main = "worker.js"
compatibility_date = "2026-09-29"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Alpha 0.1: main lee el catálogo del KV estable del editor sin modificar el editor.
[[kv_namespaces]]
binding = "PUBLIC_CONTENT"
id = "453d2d63210e42149663b5771e76a803"

# Alpha 0.1: sprites del mismo almacén estable usado por el editor.
[[r2_buckets]]
binding = "PUBLIC_SPRITES"
bucket_name = "universal-duels-sprites-test"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]
