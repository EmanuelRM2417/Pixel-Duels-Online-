;font-size:12px;color:#cfdae9;line-height:1.55}.log p{margin:0 0 4px}.log p:first-child{color:var(--mint)}.result{text-align:center;padding:12px;border-radius:12px;margin-bottom:12px;background:#24374a;color:var(--gold);font-weight:900;font-size:20px}.hidden{display:none!important}.footer{text-align:center;color:#71829a;font-size:11px;padding:12px}.tiny{font-size:12px;color:var(--muted);line-height:1.5}.pill{display:inline-block;background:#263a4e;border:1px solid #3c5269;padding:4px 8px;border-radius:99px;font-size:11px;color:#d8e7f6;margin:2px}.progress{height:5px;background:#2b3c54;border-radius:10px;margin-top:6px;overflow:hidden}.progress div{height:100%;background:var(--mint)}@media(max-width:520px){.wrap{padding:11px}.panel{padding:13px}.brand h1{font-size:18px}.hero h2{font-size:23px}.roster{grid-template-columns:1fr}.sprite{width:49px;height:49px}.battle-top{gap:8px}.fighter{padding:10px}.big-sprite{font-size:43px}.fighter h3{font-size:14px}.moves{gap:7px}.move{padding:10px;min-height:72px}.move strong{font-size:12px}.move span{font-size:10px}.coins{font-size:12px;padding:7px 10px}}

"type":"Planta","category":"Special","power":55,"accuracy":100},{"name":"Pedrada","type":"Roca","category":"Physical","power":60,"accuracy":90},{"name":"Fortalecer","type":"Roca","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Defense","amount":2}}]},{"id":"shadeowl","name":"Umbrúho","types":["Oscuridad","Aire"],"stats":{"HP":90,"Attack":105,"Defense":80,"SpA":95,"SpD":95,"Speed":115},"ability":"Acecho","moves":[{"name":"Ala Sombría","type":"Oscuridad","category":"Physical","power":60,"accuracy":95},{"name":"Viento Cortante","type":"Aire","category":"Special","power":55,"accuracy":100},{"name":"Picotazo","type":"Bicho","category":"Physical","power":45,"accuracy":100},{"name":"Mirada Fija","type":"Mente","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"enemy","stat":"Attack","amount":-1}}]},{"id":"ironbud","name":"Ferrabrote","types":["Metal","Planta"],"stats":{"HP":105,"Attack":90,"Defense":130,"SpA":80,"SpD":115,"Speed":50},"ability":"Blindaje Natural","moves":[{"name":"Embate Metálico","type":"Metal","category":"Physical","power":65,"accuracy":95},{"name":"Semilla Dura","type":"Planta","category":"Physical","power":55,"accuracy":100},{"name":"Pulso Mineral","type":"Roca","category":"Special","power":50,"accuracy":100},{"name":"Cubrirse","type":"Metal","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Defense","amount":1}}]},{"id":"mindlynx","name":"Mentialince","types":["Mente"],"stats":{"HP":85,"Attack":80,"Defense":75,"SpA":130,"SpD":105,"Speed":105},"ability":"Enfoque","moves":[{"name":"Onda Psíquica","type":"Mente","category":"Special","power":70,"accuracy":95},{"name":"Golpe Mental","type":"Mente","category":"Physical","power":45,"accuracy":100},{"name":"Destello","type":"Luz","category":"Special","power":50,"accuracy":100},{"name":"Calma","type":"Mente","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"SpA","amount":1}}]},{"id":"stonejaw","name":"Rocamandíbula","types":["Roca","Tierra"],"stats":{"HP":130,"Attack":120,"Defense":120,"SpA":55,"SpD":80,"Speed":35},"ability":"Peso Pesado","moves":[{"name":"Mordisco Rocoso","type":"Roca","category":"Physical","power":70,"accuracy":90},{"name":"Temblor","type":"Tierra","category":"Physical","power":65,"accuracy":95},{"name":"Cabeza Dura","type":"Guerra","category":"Physical","power":50,"accuracy":100},{"name":"Aguantar","type":"Tierra","category":"Status","accuracy":100,"effect":{"kind":"heal","percent":0.15}}]},{"id":"glimmerfin","name":"Lumineta","types":["Agua","Luz"],"stats":{"HP":95,"Attack":70,"Defense":85,"SpA":115,"SpD":115,"Speed":100},"ability":"Brillo Sereno","moves":[{"name":"Rayo de Aurora","type":"Luz","category":"Special","power":65,"accuracy":100},{"name":"Burbuja Prismática","type":"Agua","category":"Special","power":55,"accuracy":100},{"name":"Aleteo","type":"Aire","category":"Physical","power":45,"accuracy":100},{"name":"Regeneración","type":"Luz","category":"Status","accuracy":100,"effect":{"kind":"heal","percent":0.2}}]},{"id":"ghosthare","name":"Nebliebre","types":["Espectro"],"stats":{"HP":85,"Attack":100,"Defense":75,"SpA":110,"SpD":90,"Speed":125},"ability":"Paso Etéreo","moves":[{"name":"Eco Fantasma","type":"Espectro","category":"Special","power":65,"accuracy":95},{"name":"Zarpazo Umbrío","type":"Oscuridad","category":"Physical","power":60,"accuracy":95},{"name":"Embate","type":"Guerra","category":"Physical","power":45,"accuracy":100},{"name":"Velo Tenue","type":"Espectro","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Evasion","amount":1}}]}];
const icons={'Fuego':'🔥','Agua':'🌊','Rayo':'⚡','Planta':'🌿','Roca':'🪨','Tierra':'🌎','Aire':'🌪️','Metal':'⚙️','Dragón':'🐉','Mente':'🔮','Oscuridad':'🌑','Luz':'✨','Espectro':'👻','Bicho':'🪲','Guerra':'⚔️','Encanto':'💫','Divino':'☀️','Vacío':'🌌','Sigilo':'🗡️','Héroe':'🛡️'};
const state={coins:Number(localStorage.getItem('dp-coins')||60),team:[],battle:null};
const CONTENT_KEY='duelo-pixel-content-v2';
let CONTENT={abilities:[{id:'impulso-igneo',name:'Impulso Ígneo',description:'Aumenta el daño de ataques de Fuego.',trigger:'onAttack',kind:'damageBoost',percent:20,type:'Fuego'}],fields:[{id:'campo-base',name:'Campo base',duration:0,activeByDefault:true,description:'Sin modificadores.'}],conditions:[{id:'quemadura',name:'Quemadura',duration:3,description:'Pierde 8% de sus PS máximos al final de cada turno.',kind:'damage',percent:8,chance:100}],effects:[{id:'subir-ataque',name:'Subir ataque',kind:'stage',target:'self',stat:'Attack',amount:1,chance:100,duration:0}]};
try{const saved=JSON.parse(localStorage.getItem(CONTENT_KEY)||'null');if(saved&&Array.isArray(saved.entities))ENTITIES=saved.entities;if(saved&&saved.content)CONTENT=saved.content;}catch(e){}if(CONTENT.abilities){let a=CONTENT.abilities.find(x=>x.id==='impulso-igneo');if(a&&!a.trigger){Object.assign(a,{trigger:'onAttack',kind:'damageBoost',percent:20,type:'Fuego',description:'Aumenta el daño de ataques de Fuego.'})}}if(CONTENT.conditions){let c=CONTENT.conditions.find(x=>x.id==='quemadura');if(c&&!c.kind)Object.assign(c,{kind:'damage',percent:8,chance:100,description:'Pierde 8% de sus PS máximos al final de cada turno.'})}
function persistContent(){try{localStorage.setItem(CONTENT_KEY,JSON.stringify({entities:ENTITIES,content:CONTENT,strong:strong,weak:weak}));return true}catch(e){alert('No se pudo guardar. Exporta una copia de seguridad.');return false}}

const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function icon(e){return e.types.map(t=>icons[t]||'✦')[0]||'✦'}function saveCoins(){localStorage.setItem('dp-coins',state.coins);$('coins').textContent=state.coins}
function card(e,i,checked=false){return `<label class="creature ${checked?'selected':''}"><input class="check teamcheck" type="checkbox" value="${i}" ${checked?'checked':''}><div class="sprite">${icon(e)}</div><div style="min-width:0;flex:1"><h3>${esc(e.name)}</h3><div class="types">${e.types.map(esc).join(' · ')}</div><div class="stats">PS ${e.stats.HP} · ATQ ${e.stats.Attack} · VEL ${e.stats.Speed}</div></div></label>`}
let onlineSocket=null, onlineRoomCode='', onlineRole='', onlineRoomState=null, onlineReady=false, onlineSelectedTeam=[], onlineBattle=false, onlinePending=false, onlineSubmittedTurn=0, onlineBattleData=null, onlineBattleNotice='';
const ROOM_URL_KEY='duelo-pixel-room-server-v1';
function roomServer(){return (localStorage.getItem(ROOM_URL_KEY)||'').trim().replace(/\/$/,'')}
function roomScreen(){
  if(onlineSocket&&onlineSocket.readyState===WebSocket.OPEN){renderOnlineRoom();return}
  $('app').innerHTML=`<section class="panel hero"><h2>Salas online</h2><p>Crea una sala privada y comparte el código con otra persona. Las salas necesitan el servidor gratuito de Duelo Pixel desplegado en Cloudflare.</p></section><section class="panel"><h3 class="section-title">Conexión al servidor</h3><div class="field"><label>URL de tu servidor Cloudflare</label><input id="roomserver" placeholder="https://duelo-pixel-rooms.tuusuario.workers.dev" value="${esc(roomServer())}"></div><button class="secondary" id="saveserver">Guardar URL</button><div id="roomnotice" class="notice">Guarda la URL de Worker después de desplegarlo. No introduzcas claves secretas aquí.</div><hr style="border-color:var(--line);margin:16px 0"><h3 class="section-title">Crear o unirse</h3><div class="field"><label>Tu nombre (máximo 20 caracteres)</label><input id="roomname" maxlength="20" placeholder="Jugador"></div><div class="row"><button class="primary" id="createroom">Crear sala</button></div><div class="field" style="margin-top:14px"><label>Código de sala</label><input id="roomcode" maxlength="6" placeholder="ABC234" autocapitalize="characters"></div><button class="secondary" id="joinroom">Unirse con código</button><div class="row" style="margin-top:14px"><button class="secondary" id="roomback">Volver al menú</button></div></section>`;
  $('saveserver').onclick=()=>{const v=$('roomserver').value.trim().replace(/\/$/,'');if(!/^https:\/\//i.test(v)){ $('roomnotice').className='notice error';$('roomnotice').textContent='Usa la URL HTTPS que termina en workers.dev.';return}localStorage.setItem(ROOM_URL_KEY,v);$('roomnotice').className='notice good';$('roomnotice').textContent='URL guardada en este navegador.'};
  $('roomback').onclick=menu;
  $('createroom').onclick=async()=>{const base=readRoomServer();if(!base)return;const name=roomPlayerName();try{const res=await fetch(base+'/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await res.json();if(!res.ok)throw Error(d.error||'No se pudo crear la sala.');connectRoom(d.code,name)}catch(e){roomError(e.message)}};
  $('joinroom').onclick=()=>{const base=readRoomServer();if(!base)return;const code=$('roomcode').value.trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){roomError('El código debe tener 6 caracteres (sin O, I, 0 ni 1).');return}connectRoom(code,roomPlayerName())};
  $('roomcode').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6);
}
function readRoomServer(){const input=$('roomserver');const value=(input?.value||roomServer()).trim().replace(/\/$/,'');if(!/^https:\/\//i.test(value)){roomError('Primero introduce la URL HTTPS del servidor de Cloudflare.');return ''}localStorage.setItem(ROOM_URL_KEY,value);return value}
function roomPlayerName(){return (($('roomname')?.value||'Jugador').trim().replace(/[<>]/g,'').slice(0,20)||'Jugador')}
function roomError(message){const n=$('roomnotice');if(n){n.className='notice error';n.textContent=message}else alert(message)}
function connectRoom(code,name){const base=readRoomServer();if(!base)return;onlineRoomCode=code;onlineRole='';onlineRoomState=null;onlineReady=false;onlineSelectedTeam=[];const wsBase=base.replace(/^https:/i,'wss:').replace(/^http:/i,'ws:');const ws=new WebSocket(`${wsBase}/api/rooms/${encodeURIComponent(code)}?name=${encodeURIComponent(name)}`);onlineSocket=ws;const oldApp=$('app');oldApp.innerHTML=`<section class="panel"><h2 class="section-title">Conectando a la sala ${esc(code)}…</h2><div id="roomconnectnotice" class="notice">Esperando respuesta del servidor.</div><button class="secondary" id="cancelroom">Volver</button></section>`;$('cancelroom').onclick=()=>{try{ws.close()}catch{}onlineSocket=null;roomScreen()};ws.onopen=()=>{const n=$('roomconnectnotice');if(n)n.textContent='Conexión establecida. Entrando a la sala…'};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='welcome'){onlineRole=d.role;renderOnlineRoom()}else if(d.type==='room'){onlineRoomState=d.room;if(!onlineBattle)renderOnlineRoom()}else if(d.type==='chat'){addRoomChat(`${d.name}: ${d.text}`)}else if(d.type==='notice'){addRoomChat(d.message)}else if(d.type==='error'){addRoomChat('Error: '+d.message)}else if(d.type==='battle_start'){startOnlineBattle(d)}else if(d.type==='battle_aborted'){onlineBattle=false;onlineBattleData=null;onlinePending=false;onlineSubmittedTurn=0;onlineBattleNotice=d.message;addRoomChat(d.message);if(onlineSocket&&onlineSocket.readyState===WebSocket.OPEN)renderOnlineRoom()}else if(d.type==='battle_waiting'){if(d.turn===state.battle?.turn){onlinePending=true;renderOnlineBattle()}}else if(d.type==='turn_resolve'){if(onlineBattle&&d.turn===state.battle.turn)resolveOnlineTurn(d)}};ws.onerror=()=>{const n=$('roomconnectnotice');if(n)n.textContent='No se pudo conectar. Comprueba la URL del Worker y que esté desplegado.'};ws.onclose=()=>{if(onlineSocket===ws){onlineSocket=null;onlineRole='';const n=$('online-room-notice');if(n){n.className='notice error';n.te recibir estado'],['onKO','Al debilitar'],['endTurn','Final de turno']].map(([v,l])=>`<option value="${v}" ${ef.trigger===v?'selected':''}>${l}</option>`).join('')}</select></div></div><button type="button" class="danger" data-fe-remove="${i}">Eliminar este efecto</button></div>`}function options(){let h='';if(tab==='abilities')h=`<div class="formgrid"><div class="field"><label>Evento principal</label><select id="gentrigger">${[['onBattleStart','Al comenzar el combate'],['onTurnStart','Al inicio de cada turno'],['beforeAttack','Antes de atacar'],['onAttack','Al atacar'],['onHit','Al acertar'],['onMiss','Al fallar'],['onCritical','Al hacer un crítico'],['onDamaged','Al recibir daño'],['onLowHP','Al bajar del umbral de PS'],['onStatusApplied','Al recibir un estado'],['onKO','Al debilitar a un rival'],['endTurn','Al final de cada turno']].map(([v,l])=>`<option value="${v}" ${item.trigger===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Condición de PS (opcional)</label><input id="genthreshold" type="number" min="1" max="99" value="${item.threshold==null?'':Number(item.threshold)}"><small class="tiny">Solo se usa con «Al bajar del umbral de PS».</small></div></div><h4>Efectos de la habilidad (todos opcionales)</h4><p class="tiny">Puedes añadir cero, uno o varios efectos. Cada efecto puede tener sus propios tipos afectados, tipos inmunes, objetivo, probabilidad y evento.</p><div id="abilityeffects">${fieldEffectsDraft.map((ef,i)=>fieldEffectRow(ef,i,tab)).join('')}</div><button type="button" class="secondary" id="addabilityeffect">+ Añadir efecto</button>`;else if(tab==='fields')h=`<div class="formgrid"><div class="field"><label>Duración (0 = permanente)</label><input id="genduration" type="number" min="0" max="99" value="${Number(item.duration)||0}"></div><div class="field"><label>Activar al iniciar</label><select id="gendefault"><option value="false" ${!item.activeByDefault?'selected':''}>No</option><option value="true" ${item.activeByDefault?'selected':''}>Sí</option></select></div></div><hr style="border-color:var(--line)"><h4>Reglas independientes del campo, clima o escenario</h4><p class="tiny">Añade cero o varios efectos. Cada regla puede tener sus propios tipos afectados e inmunes. La curación, el daño, los estados y los cambios de estadísticas ocurren al final del turno; los modificadores de daño y velocidad se aplican durante el combate.</p><div id="fieldeffects">${fieldEffectsDraft.map((ef,i)=>fieldEffectRow(ef,i,tab)).join('')}</div><button type="button" class="secondary" id="addfieldeffect">+ Añadir efecto</button>`;else if(tab==='conditions')h=`<div class="formgrid"><div class="field"><label>Duración (turnos)</label><input id="genduration" type="number" min="1" max="99" value="${Number(item.duration)||3}"></div><div class="field"><label>Efecto</label><select id="genkind">${[['none','Ninguno'],['damage','Daño al final del turno'],['heal','Curación al final del turno'],['skip','Posibilidad de no actuar']].map(([v,l])=>`<option value="${v}" ${kind===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Porcentaje de PS por turno</label><input id="genpercent" type="number" min="0" max="100" value="${Number(item.percent)||0}"></div><div class="field"><label>Probabilidad de no actuar (%)</label><input id="genchance" type="number" min="0" max="100" value="${Number(item.chance??100)}"></div></div>`;else h=`<div class="formgrid"><div class="field"><label>Tipo de efecto</label><select id="genkind"><option value="stage" ${kind==='stage'?'selected':''}>Cambio de estadística</option><option value="heal" ${kind==='heal'?'selected':''}>Curación</option><option value="status" ${kind==='status'?'selected':''}>Aplicar estado</option><option value="field" ${kind==='field'?'selected':''}>Cambiar campo</option></select></div><div class="field"><label>Objetivo</label><select id="gentarget"><option value="self" ${item.target==='self'?'selected':''}>Usuario</option><option value="opponent" ${item.target!=='self'?'selected':''}>Rival</option></select></div><div class="field"><label>Estadística</label><select id="genstat">${[['Attack','Ataque'],['Defense','Defensa'],['SpA','Ataque especial'],['SpD','Defensa especial'],['Speed','Velocidad'],['Accuracy','Precisión'],['Evasion','Evasión']].map(([v,l])=>`<option value="${v}" ${item.stat===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Niveles / porcentaje</label><input id="genamount" type="number" value="${Number(item.amount??1)}"></div><div class="field"><label>Estado (para aplicar estado)</label><select id="genstatus">${(CONTENT.conditions||[]).map(c=>`<option value="${esc(c.id||c.name)}" ${(item.status===c.id||item.status===c.name)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Campo (para cambiar campo)</label><select id="genfield">${(CONTENT.fields||[]).map(f=>`<option value="${esc(f.id||f.name)}" ${(item.field===f.id||item.field===f.name)?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Probabilidad (%)</label><input id="genchance" type="number" min="0" max="100" value="${Number(item.chance??100)}"></div></div>`;$('genoptions').innerHTML=h}
function readItem(){let x={id:$('genid').value.trim(),name:$('genname').value.trim(),description:$('gendesc').value.trim()};const readRows=()=>fieldEffectsDraft.map((ef,i)=>({kind:document.querySelector(`[data-fe-kind="${i}"]`)?.value||'none',target:document.querySelector(`[data-fe-target="${i}"]`)?.value||'all',types:[...(document.querySelector(`[data-fe-types="${i}"]`)?.selectedOptions||[])].map(o=>o.value),immuneTypes:[...(document.querySelector(`[data-fe-immune="${i}"]`)?.selectedOptions||[])].map(o=>o.value),moveType:document.querySelector(`[data-fe-movetype="${i}"]`)?.value||'',percent:Number(document.querySelector(`[data-fe-percent="${i}"]`)?.value??0),stat:document.querySelector(`[data-fe-stat="${i}"]`)?.value||'Attack',amount:Number(document.querySelector(`[data-fe-amount="${i}"]`)?.value??0),status:document.querySelector(`[data-fe-status="${i}"]`)?.value||'',field:document.querySelector(`[data-fe-field="${i}"]`)?.value||'',chance:Number(document.querySelector(`[data-fe-chance="${i}"]`)?.value??100),trigger:document.querySelector(`[data-fe-trigger="${i}"]`)?.value||''}));if(tab==='abilities'){x.trigger=$('gentrigger').value;x.threshold=$('genthreshold').value.trim()===''?null:Math.max(1,Math.min(99,Number($('genthreshold').value)||50));x.effects=readRows();x.kind='none'}else if(tab==='fields'){x.duration=Number($('genduration').value);x.activeByDefault=$('gendefault').value==='true';x.damageType='';x.damagePercent=0;x.speedType='';x.speedPercent=0;x.effects=readRows()}else if(tab==='conditions'){x.duration=Number($('genduration').value);x.kind=$('genkind').value;x.percent=Number($('genpercent').value);x.chance=Number($('genchance').value)}else{x.kind=$('genkind').value;x.target=$('gentarget').value;x.stat=$('genstat').value;x.amount=Number($('genamount').value);if(x.kind==='heal')x.percent=x.amount;x.status=$('genstatus').value.trim();x.field=$('genfield')?.value||'';x.chance=Number($('genchance').value)}return x}options();if(tab==='fields'||tab==='abilities'){$('genoptions').onclick=e=>{let remove=e.target.closest('[data-fe-remove]');if(remove){fieldEffectsDraft.splice(Number(remove.dataset.feRemove),1);options();return}if(e.target.closest('#addfieldeffect')||e.target.closest('#addabilityeffect')){fieldEffectsDraft.push({kind:'none',target:'all',types:[],immuneTypes:[],moveType:'',percent:0,stat:'Attack',amount:0,status:'',field:'',chance:100,trigger:''});options()}}}if(tab==='abilities'){/* Todos los eventos están disponibles independientemente de los efectos opcionales. */}$('genericselect').onchange=e=>{if(e.target.value==='new'){selectedGeneric=list.length;item={id:'',name:'',description:''};$('genid').value='';$('genname').value='';$('gendesc').value='';options();return}selectedGeneric=Number(e.target.value);renderGenericEditor(root,tab)};$('newgeneric').onclick=()=>{selectedGeneric=list.length;item={id:tab.slice(0,-1)+'-'+Date.now(),name:'Nuevo elemento',description:''};renderGenericEditor(root,tab);$('genericselect').value='new'};$('deletegeneric').onclick=()=>{if(selectedGeneric>=list.length)return;if(!confirm(`¿Eliminar «${list[selectedGeneric].name}»?`))return;let del=list.splice(selectedGeneric,1)[0];if(tab==='abilities')ENTITIES.forEach(e=>{if(e.ability===del.id||e.ability===del.name)e.ability=''});selectedGeneric=Math.max(0,selectedGeneric-1);persistContent();renderGenericEditor(root,tab)};$('savegeneric').onclick=()=>{let x=readItem(),errs=[];if(!x.id||!x.name)errs.push('ID y nombre son obligatorios.');if(list.some((v,i)=>i!==selectedGeneric&&v.id===x.id))errs.push('El ID debe ser único.');if(tab==='abilities'&&x.kind==='statBoost'&&(!Number.isInteger(x.amount)||x.amount< -10||x.amount>10))errs.push('Los niveles deben ser un entero de -10 a 10.');if(tab==='abilities'&&['damageBoost','damageReduction','heal'].includes(x.kind)&&(!Number.isFinite(x.percent)||x.percent<0||x.percent>500))errs.push('El porcentaje debe estar entre 0 y 500.');if(tab==='conditions'&&(!Number.isFinite(x.duration)||x.duration<1||x.duration>99||x.percent<0||x.percent>100||x.chance<0||x.chance>100))errs.push('Revisa duración, porcentaje y probabilidad.');if(tab==='fields'&&(!Number.isFinite(x.duration)||x.duration<0||x.duration>99||x.damagePercent< -100||x.damagePercent>500||x.speedPercent< -90||x.speedPercent>500))errs.push('Revisa duración y modificadores del campo.');if((tab==='fields'||tab==='abilities')&&(x.effects||[]).some(e=>!['none','heal','damage','stage','damageBoost','damageReduction','speedBoost','speedReduction','status','field','statusImmunity'].includes(e.kind)||e.percent< -100||e.percent>500||e.chance<0||e.chance>100||e.amount< -10||e.amount>10))errs.push('Revisa los efectos del campo: tipo, porcentaje, niveles o probabilidad inválidos.');if(errs.length){$('genvalidation').innerHTML=`<div class="notice error">${errs.map(esc).join('<br>')}</div>`;return}if(tab==='fields'&&x.activeByDefault)CONTENT.fields.forEach(f=>f.activeByDefault=false);if(selectedGeneric<list.length)list[selectedGeneric]=x;else{list.push(x);selectedGeneric=list.length-1}if(tab==='abilities')ENTITIES.forEach(e=>{if(e.ability===item.id||e.ability===item.name)e.ability=x.id});persistContent();$('genvalidation').innerHTML='<div class="notice good">Guardado. Se aplicará en los combates nuevos.</div>';renderGenericEditor(root,tab)}}

function renderTypeEditor(root){root.innerHTML=`<p class="tiny">Cada ataque compara su tipo con cada tipo defensivo. Los modificadores se suman: ventaja +20%, desventaja −20%. Una criatura con dos tipos acumula ambos modificadores.</p><div class="formgrid"><div class="field"><label>Ventajas (ataque → tipos defensivos)</label><textarea id="strongjson">${esc(JSON.stringify(strong,null,2))}</textarea></div><div class="field"><label>Desventajas (ataque → tipos defensivos)</label><textarea id="weakjson">${esc(JSON.stringify(weak,null,2))}</textarea></div></div><div id="typevalidation"></div><div class="row"><button class="primary" id="savetypechart">Validar y guardar tabla</button><button class="secondary" id="resettypechart">Restablecer tabla original</button></div><div class="notice">Esta tabla se utiliza directamente en los combates y en la fórmula de daño. Las inmunidades aún no están implementadas en el motor.</div>`;$('savetypechart').onclick=()=>{try{let s=JSON.parse($('strongjson').value),w=JSON.parse($('weakjson').value),errs=[];[s,w].forEach((obj,idx)=>{if(!obj||typeof obj!=='object'||Array.isArray(obj))errs.push('La tabla debe ser un objeto.');Object.entries(obj||{}).forEach(([k,v])=>{if(!TYPES.includes(k))errs.push('Tipo atacante desconocido: '+k);if(!Array.isArray(v)||v.some(t=>!TYPES.includes(t)))errs.push('Lista inválida para '+k+'.')})});if(errs.length){$('typevalidation').innerHTML=`<div class="notice error">${errs.map(esc).join('<br>')}</div>`;return}strong=s;weak=w;persistContent();$('typevalidation').innerHTML='<div class="notice good">Tabla guardada y aplicada a los combates.</div>'}catch(e){$('typevalidation').innerHTML=`<div class="notice error">JSON inválido: ${esc(e.message)}</div>`}};$('resettypechart').onclick=()=>{if(confirm('¿Restablecer la tabla original? Recarga la página para recuperar la configuración base.')){localStorage.removeItem(CONTENT_KEY);location.reload()}}}
function renderDataTools(root){root.innerHTML=`<h3 class="section-title">Guardar y transferir contenido</h3><div class="notice">Los datos se guardan en el almacenamiento local de este navegador. Si borras los datos del navegador o cambias de dispositivo, usa la exportación para conservar el contenido.</div><div class="json-actions"><button class="primary" id="exportdata">Exportar todo (.json)</button><button class="secondary" id="copydata">Ver JSON</button><button class="secondary" id="validateall">Validar contenido</button></div><div class="field"><label>Importar copia JSON</label><textarea id="importjson" placeholder="Pega aquí una exportación de Duelo Pixel"></textarea></div><button class="gold" id="importdata">Validar e importar</button><div id="dataresult"></div><hr style="border-color:var(--line);margin:18px 0"><h3 class="section-title">Simulador rápido de daño</h3><p class="tiny">Prueba una fórmula aproximada con estadísticas base, potencia, STAB y efectividad. No altera la partida.</p><div class="formgrid"><div class="field"><label>Ataque</label><input id="simatk" type="number" value="100" min="1"></div><div class="field"><label>Defensa</label><input id="simdef" type="number" value="100" min="1"></div><div class="field"><label>Potencia</label><input id="simpow" type="number" value="60" min="1"></div><div class="field"><label>Modificador total (%)</label><input id="simmod" type="number" value="20"></div></div><button class="primary" id="simrun">Calcular daño</button><div id="simresult" class="notice">Resultado pendiente.</div><hr style="border-color:var(--line);margin:18px 0"><h3 class="section-title">Simulador de movimiento real</h3><p class="tiny">Ejecuta un movimiento con las habilidades, estados y campos configurados. La prueba no modifica tus criaturas guardadas ni la partida.</p><div class="formgrid"><div class="field"><label>Atacante</label><select id="testattacker">${ENTITIES.map((e,i)=>`<option value="${i}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Movimiento del atacante</label><select id="testmove"></select></div><div class="field"><label>Defensor</label><select id="testdefender">${ENTITIES.map((e,i)=>`<option value="${i}" ${i===1?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>PS iniciales del defensor (%)</label><input id="testdefhp" type="number" min="1" max="100" value="100"></div><div class="field"><label>Campo inicial (opcional)</label><select id="testfield"><option value="">Sin campo</option>${(CONTENT.fields||[]).map(f=>`<option value="${esc(f.id||f.name)}">${esc(f.name)}</option>`).join('')}</select></div></div><button class="primary" id="runmovesim">Probar movimiento</button><div id="movesimresult" class="notice">Selecciona las criaturas y ejecuta una prueba.</div><h3 class="section-title">Estado del contenido</h3><div id="contentstats" class="notice"></div>`;$('exportdata').onclick=()=>downloadJSON({version:2,entities:ENTITIES,content:CONTENT,strong:strong,weak:weak},'duelo-pixel-datos.json');$('copydata').onclick=()=>{$('importjson').value=JSON.stringify({version:2,entities:ENTITIES,content:CONTENT,strong:strong,weak:weak},null,2);$('dataresult').innerHTML='<div class="notice good">JSON listo en el cuadro de importación. Puedes copiarlo.</div>'};$('validateall').onclick=()=>{let errs=[];ENTITIES.forEach(e=>validateEntity(e).forEach(x=>errs.push(e.name+': '+x)));let catalogs=['abilities','fields','conditions','effects'];catalogs.forEach(k=>{let arr=CONTENT[k]||[],ids=arr.map(x=>x.id);if(new Set(ids).size!==ids.length)errs.push('Hay IDs duplicados en '+k+'.');arr.forEach(x=>{if(!x.id||!x.name)errs.push(k+': cada elemento necesita ID y nombre.');if(k==='abilities'&&!['none','statBoost','damageBoost','damageReduction','heal','statusImmunity'].includes(x.kind))errs.push('Habilidad '+x.name+': efecto no reconocido.');if(k==='abilities'&&!['onBattleStart','onTurnStart','beforeAttack','onAttack','onHit','onMiss','onCritical','onDamaged','onLowHP','onStatusApplied','onKO','endTurn'].includes(x.trigger))errs.push('Habilidad '+x.name+': evento de activación no reconocido.');if(k==='conditions'&&(!Number.isFinite(Number(x.duration))||x.duration<1||x.duration>99))errs.push('Estado '+x.name+': duración inválida.');if(k==='fields'&&(!Number.isFinite(Number(x.duration))||x.duration<0||x.duration>99))errs.push('Campo '+x.name+': duración inválida.');if(k==='effects'&&!['stage','heal','status','field'].includes(x.kind))errs.push('Efecto '+x.name+': tipo no reconocido.');});});let ids=ENTITIES.map(e=>e.id);if(new Set(ids).size!==ids.length)errs.push('Hay IDs de criatura duplicados.');ENTITIES.forEach(e=>(e.moves||[]).forEach(m=>{if(m.effect&&m.effect.kind==='field'&&!(CONTENT.fields||[]).some(f=>f.id===m.effect.field||f.name===m.effect.field))errs.push(e.name+' / '+m.name+': el campo referenciado no existe.');if(m.effect&&m.effect.kind==='status'&&!(CONTENT.conditions||[]).some(c=>c.id===m.effect.status||c.name===m.effect.status))errs.push(e.name+' / '+m.name+': el estado referenciado no existe.')}));$('dataresult').innerHTML=errs.length?`<div class="notice error">${errs.slice(0,40).map(esc).join('<br>')}${errs.length>40?'<br>…y '+(errs.length-40)+' errores más.':''}</div>`:'<div class="notice good">Validación completa: criaturas, movimientos, habilidades, campos, estados, efectos e IDs revisados sin errores estructurales.</div>'};$('importdata').onclick=()=>{try{let d=JSON.parse($('importjson').value);if(!Array.isArray(d.entities)||!d.content||typeof d.content!=='object')throw Error('El archivo debe incluir entities y content.');let errs=[];d.entities.forEach(e=>validateEntity(e).forEach(x=>errs.push((e.name||e.id)+': '+x)));if(errs.length)throw Error(errs.slice(0,12).join(' | '));ENTITIES=d.entities;CONTENT=d.content;if(d.strong&&d.weak){strong=d.strong;weak=d.weak}selectedEntity=0;selectedGeneric=0;persistContent();$('dataresult').innerHTML='<div class="notice good">Contenido importado y guardado.</div>';renderEditorBody()}catch(err){$('dataresult').innerHTML=`<div class="notice error">No se importó: ${esc(err.message)}</div>`}};$('simrun').onclick=()=>{let a=Math.max(1,Number($('simatk').value)),d=Math.max(1,Number($('simdef').value)),p=Math.max(1,Number($('simpow').value)),m=Number($('simmod').value);let base=p*a/(a+d),damage=Math.max(1,Math.round(base*(1+m/100)));$('simresult').innerHTML=`Daño base: ${base.toFixed(2)}<br><strong>Daño final estimado: ${damage}</strong>`};let refreshTestMoves=()=>{let e=ENTITIES[Number($('testattacker').value)||0];$('testmove').innerHTML=(e?.moves||[]).map((m,i)=>`<option value="${i}">${i+1}. ${esc(m.name)}</option>`).join('')};refreshTestMoves();$('testattacker').onchange=refreshTestMoves;$('runmovesim').onclick=()=>{try{let ai=Number($('testattacker').value),di=Number($('testdefender').value),mi=Number($('testmove').value),a=fresh(JSON.parse(JSON.stringify(ENTITIES[ai]))),d=fresh(JSON.parse(JSON.stringify(ENTITIES[di]))),pct=Math.max(1,Math.min(100,Number($('testdefhp').value)||100));d.hp=Math.round(d.max*pct/100);let field=(CONTENT.fields||[]).find(f=>f.id===$('testfield').value||f.name===$('testfield').value)||null,prev=state.battle;state.battle={p:[a],e:[d],pi:0,ei:0,turn:1,field:field?JSON.parse(JSON.stringify(field)):null,fieldTurns:field?(Number(field.duration)>0?Number(field.duration):-1):0,log:[],result:null,reward:0};[a,d].forEach(f=>triggerAbility(f,'onBattleStart'));let before=d.hp;useMove(a,d,a.data.moves[mi]);let resultLog=state.battle.log.slice(),damage=before-d.hp,finalField=state.battle.field;state.battle=prev;$('movesimresult').innerHTML=`<strong>${esc(a.data.name)} → ${esc(d.data.name)}</strong><br>Daño: ${damage} PS<br>PS del defensor: ${d.hp}/${d.max}<br>Estado: ${d.status?esc(d.status.name):'ninguno'}<br>Campo: ${finalField?esc(finalField.name):'ninguno'}<hr style="border-color:var(--line)">${resultLog.length?resultLog.map(x=>esc(x)).join('<br>'):'No se registraron efectos.'}`}catch(err){$('movesimresult').innerHTML=`<div class="notice error">No se pudo ejecutar la prueba: ${esc(err.message)}</div>`}};$('contentstats').innerHTML=`Criaturas: ${ENTITIES.length}<br>Movimientos: ${allMoves().length}<br>Habilidades: ${(CONTENT.abilities||[]).length}<br>Campos: ${(CONTENT.fields||[]).length}<br>Estados: ${(CONTENT.conditions||[]).length}<br>Efectos: ${(CONTENT.effects||[]).length}`}
function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
