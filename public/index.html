<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11131d"><title>Universal Duels — Alpha 0.1</title>
<style>
:root{--bg:#0e1018;--panel:#1b1e2c;--panel2:#25293b;--line:#3a3f57;--text:#f4f2ff;--muted:#a9acc2;--accent:#a99bff;--good:#72dfae;--warn:#f5c66b;--bad:#ef7889}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#292744,#0e1018 52%);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#30344a;color:white;border-radius:10px;padding:10px 13px;font-weight:700}button:hover{border-color:#7770a7}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#5c5193;border-color:#897bd5}.danger{background:#572c38;border-color:#864352}.ghost{background:transparent}.wrap{max-width:1650px;margin:auto;padding:18px}#home,#lobby{max-width:1100px;margin-left:auto;margin-right:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}.badge{padding:6px 10px;border:1px solid #6d6594;border-radius:999px;color:#d9d2ff;font-size:12px}.panel{background:linear-gradient(160deg,#202334,#171a27);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 15px 40px #0003}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{width:100%;padding:12px;border:1px solid #454a65;border-radius:10px;background:#11131d;color:white}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.status{min-height:22px;color:var(--muted)}.error{color:#ff9aa8}.good{color:#8de9c0}.roomcode{font-size:24px;letter-spacing:5px;font-weight:900}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#151824}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:6px}.dot.on{background:var(--good)}.team-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:16px}.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;max-height:480px;overflow:auto;padding-right:4px}.entity{display:flex;gap:9px;align-items:center;text-align:left;background:#171a26;padding:9px}.entity.selected{border-color:var(--accent);background:#282642}.thumb{width:54px;height:54px;overflow:hidden;position:relative;flex:none}.thumb img{position:absolute;height:54px;width:108px;left:0;image-rendering:pixelated;object-fit:fill}.entity strong{display:block}.types{font-size:11px;color:#b6b4ca}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 9px;border-radius:999px;background:#302f45;border:1px solid #4d4b68;font-size:12px}.chip button{padding:0 0 0 5px;border:0;background:none}.team-count{font-weight:800;color:#ded8ff}

.battle-shell{margin-top:18px;border:1px solid #3d405c;border-radius:18px;overflow:hidden;background:#121522;box-shadow:0 18px 42px #07081255}.battle-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:#1a1d2d;border-bottom:1px solid #343750}.battle-toolbar button{width:auto;margin:0;padding:9px 12px}.battle-toolbar .spacer{flex:1}.battle-toolbar select{width:auto;margin:0;padding:8px;background:#111423;color:#fff;border:1px solid #4c506c;border-radius:8px}.battle-stage{position:relative;min-height:560px;overflow:hidden;background:linear-gradient(#242942 0 58%,#373b42 58% 61%,#252a31 61%);perspective:800px}.battle-stage::after{content:"";position:absolute;left:8%;right:8%;bottom:7%;height:34%;border-radius:50%;background:radial-gradient(ellipse,#3b4148 0 42%,#2d3238 43% 60%,transparent 61%);opacity:.72}.battle-unit{position:absolute;z-index:2;width:min(36%,330px);transition:transform .24s ease,filter .18s ease}.battle-unit.enemy{right:8%;top:8%}.battle-unit.player{left:7%;bottom:8%}.battle-sprite-window{width:220px;height:220px;overflow:hidden;position:relative;margin:auto;filter:drop-shadow(0 14px 8px #0008)}.battle-sprite-sheet{position:absolute;top:0;width:440px;height:220px;object-fit:fill;image-rendering:pixelated}.enemy .battle-sprite-sheet{left:0}.player .battle-sprite-sheet{left:-220px}.battle-nameplate{background:#f3f0e8;color:#1a1b22;border:4px solid #30313b;border-radius:14px;padding:9px 12px;box-shadow:0 5px 0 #1117;max-width:280px;margin:auto}.battle-nameplate strong{display:flex;justify-content:space-between;gap:10px}.battle-hp-track{height:12px;border:2px solid #272832;border-radius:9px;overflow:hidden;background:#8b2f38;margin-top:6px}.battle-hp-fill{height:100%;background:#4caf65;transition:width 1.15s linear!important}.battle-hp-text{font-size:11px;text-align:right;margin-top:3px}.battle-message{position:absolute;z-index:5;left:3%;right:3%;bottom:2%;min-height:72px;background:#f6f3e9;color:#20212a;border:5px double #333743;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;box-shadow:0 6px 0 #0c0d14aa}.battle-unit.anim-physical.player{animation:physicalRight .55s ease}.battle-unit.anim-physical.enemy{animation:physicalLeft .55s ease}.battle-unit.anim-special{animation:specialPulse .55s ease}.battle-unit.anim-hit{animation:hitShake .38s ease}.battle-unit.anim-status{animation:statusOrbit .7s ease}@keyframes physicalRight{0%,100%{transform:translate(0)}45%{transform:translate(46vw,-15vh) scale(1.08)}}@keyframes physicalLeft{0%,100%{transform:translate(0)}45%{transform:translate(-46vw,15vh) scale(1.08)}}@keyframes specialPulse{0%,100%{transform:translate(0)}20%{transform:translate(-7px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(5px,2px)}}@keyframes hitShake{0%,100%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(-9px);filter:brightness(1.8)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}@keyframes statusOrbit{0%,100%{transform:translate(0,0)}25%{transform:translate(8px,-6px)}50%{transform:translate(0,-12px)}75%{transform:translate(-8px,-6px)}}.battle-modal{position:fixed;z-index:100;inset:0;background:#070812bb;display:grid;place-items:center;padding:24px}.battle-modal[hidden]{display:none}.battle-modal-card{width:min(760px,96vw);max-height:82vh;overflow:auto;background:#202337;border:1px solid #555a79;border-radius:16px;padding:20px;box-shadow:0 24px 70px #000b}.battle-modal-card header{display:flex;align-items:center;gap:12px}.battle-modal-card header h3{margin:0;flex:1}.battle-modal-card button{width:auto;margin:0}.battle-log-round{border-left:3px solid #8f82ff;padding:8px 12px;margin:12px 0;background:#171a29}.effect-chip{display:inline-block;padding:5px 8px;border:1px solid #555a78;border-radius:999px;margin:3px;font-size:12px;background:#171a29}.battle-empty{display:grid;place-items:center;height:100%;color:#999db8}.battle-actions{position:absolute;z-index:6;right:3%;bottom:2%;width:min(500px,58%);padding:8px;background:transparent;border:0}.battle-move-grid{display:grid!important;grid-template-columns:1fr 1fr!important;grid-template-rows:1fr 1fr;gap:7px}.battle-move{margin:0!important;min-height:58px!important;text-align:left;padding:7px 11px!important;border:1px solid #5d6284;border-radius:12px;background:#272b42;color:#fff;cursor:pointer}.battle-move:hover{background:#313650}.battle-move strong,.battle-move small{display:block}.battle-move small{opacity:.72;margin-top:4px}.battle-move.show-info small{font-size:10px;line-height:1.25}.battle-move.chosen{outline:2px solid #a79cff;opacity:1!important}.battle-move[disabled]{opacity:.42;cursor:not-allowed}.battle-move .cooldown{float:right;font-size:11px}.battle-command-left{position:absolute;z-index:7;left:3%;bottom:2%;display:grid!important;grid-template-columns:72px!important;grid-template-rows:58px 58px;gap:7px}.battle-command-left button{width:72px!important;height:58px!important;margin:0;padding:5px;font-size:12px}.battle-move-info{line-height:1.55}.battle-move-info dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}.battle-move-info dt{opacity:.7}.battle-speed{display:flex;align-items:center;gap:6px}.battle-speed button{padding:7px 9px}.battle-speed button[aria-pressed="true"]{background:#6e63cf}.environment-card{border:1px solid #4d526f;border-radius:12px;padding:12px;margin:10px 0;background:#171a29}.environment-card h4{margin:0 0 8px}.environment-effect{display:block;padding:7px 9px;margin:5px 0;border-radius:8px;background:#22263a}.stat-comparison{padding:10px 12px;margin:8px 0;border:1px solid #4d526f;border-radius:10px;background:#171a29}.stat-comparison div{display:flex;justify-content:space-between;padding:3px 0}.battle-switch-choice{display:block;width:100%!important;text-align:left;margin:6px 0!important;padding:10px 12px!important;background:#2a2d42}.battle-round-label{color:#aeb0c8;font-size:12px}.battle-toolbar .danger{background:#572c38;border-color:#864352}@media(max-width:700px){.battle-command-left{left:2%;grid-template-columns:58px!important;grid-template-rows:52px 52px}.battle-command-left button{width:58px!important;height:52px!important}.battle-actions{right:2%;width:70%}.battle-move{min-height:54px!important;padding:6px 8px!important}.battle-stage{min-height:610px}}
@media(max-width:760px){.grid2,.team-layout{grid-template-columns:1fr}.players{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><h1>Universal Duels</h1><small>Combates por turnos · Alpha pública</small></div><span class="badge">Alpha 0.1</span></header>
<section id="home" class="panel"><h2>Entrar a una batalla</h2><p style="color:var(--muted)">Creá una sala privada o entrá con el código de otra persona.</p><div class="grid2"><div class="field"><label>Tu nombre</label><input id="name" maxlength="20" placeholder="Jugador"></div><div class="field"><label>Código para unirte</label><input id="joinCode" maxlength="6" placeholder="ABC234" style="text-transform:uppercase"></div></div><div class="row" style="margin-top:12px"><button id="create" class="primary">Crear sala</button><button id="join">Unirme</button></div><p id="homeStatus" class="status"></p></section>
<section id="lobby" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><small style="color:var(--muted)">Sala</small><div id="roomCode" class="roomcode"></div></div><button id="copyCode">Copiar código</button></div><div id="players" class="players" style="margin-top:12px"></div><p id="roomStatus" class="status"></p></div><div class="panel"><h2>Tu equipo</h2><div class="team-layout"><div><div class="field"><label>Buscar personaje</label><input id="teamSearch" type="search" placeholder="Nombre, tipo o etiqueta"></div><div id="roster" class="roster" style="margin-top:10px"></div></div><div><div class="row" style="justify-content:space-between"><strong>Seleccionados</strong><span id="teamCount" class="team-count">0 / 8</span></div><p style="font-size:12px;color:var(--muted)">El primero será tu personaje activo inicial.</p><div id="teamChips" class="chips"></div><div class="row" style="margin-top:14px"><button id="saveTeam" class="primary">Guardar equipo</button><button id="ready" disabled>Estoy listo</button></div><p id="teamStatus" class="status"></p></div></div></div></section>
<section id="battleView" class="hidden"><div class="battle-shell"><div class="battle-toolbar"><strong>Vista:</strong><select id="battlePerspective" disabled><option value="left">Jugador 1</option><option value="right">Jugador 2</option></select><div class="battle-speed"><span>Velocidad:</span><button type="button" data-speed="normal" aria-pressed="true">Normal</button><button type="button" data-speed="fast" aria-pressed="false">Rápida</button><button type="button" data-speed="x2" aria-pressed="false">×2</button></div><span id="roundLabel" class="battle-round-label"></span><span class="spacer"></span><button type="button" data-battle-modal="player">Efectos jugador</button><button type="button" data-battle-modal="enemy">Efectos rival</button><button type="button" data-battle-modal="environment">Campo · Clima · Escenario</button><button type="button" data-battle-modal="log">Battle log</button></div><div class="battle-stage" id="battleStage"><div class="battle-empty">Esperando el inicio de la batalla.</div></div></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="surrender" type="button" class="danger">Rendirse</button></div></section>
</div><div class="battle-modal" id="battleModal" hidden><div class="battle-modal-card"><header><h3 id="battleModalTitle">Detalles</h3><button type="button" id="battleModalClose">Cerrar</button></header><div id="battleModalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog=null,revision=null,ws=null,role=null,room=null,battle=null,team=[],teamSaved=false,actionLocked=false;
const TYPE_NAMES={fuego:'Fuego',planta:'Planta',roca:'Roca',hielo:'Hielo',rayo:'Rayo',metal:'Metal',guerra:'Guerra',mente:'Mente',encanto:'Encanto',espectro:'Espectro',divinidad:'Divinidad',luz:'Luz',oscuridad:'Oscuridad',viento:'Viento',dragon:'Dragón',agua:'Agua',veneno:'Veneno',tecnologia:'Tecnología',agilidad:'Agilidad',valor:'Valor'};
async function loadCatalog(rev=''){const r=await fetch('/api/catalog'+(rev?'/'+encodeURIComponent(rev):'')),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'No se pudo cargar el catálogo.');catalog=d.catalog;revision=d.revision;renderRoster();return d;}
function entity(id){return catalog?.entities?.[id]} function move(id){return catalog?.moves?.[id]} function statusName(id){return catalog?.statuses?.[id]?.name||id||'—'}
function spriteUrl(id,rev=revision){const e=entity(id),sid=e?.definition?.spriteId;return sid?'/api/sprites/'+encodeURIComponent(sid)+(rev?'?revision='+encodeURIComponent(rev):''):''}
function entityCard(e){const url=spriteUrl(e.id),d=e.definition||{},selected=team.includes(e.id);return `<button class="entity ${selected?'selected':''}" data-entity="${esc(e.id)}">${url?`<span class="thumb"><img src="${url}" alt=""></span>`:''}<span><strong>${esc(e.name)}</strong><span class="types">${(d.types||[]).map(t=>TYPE_NAMES[t]||t).join(' · ')}</span></span></button>`}
function renderRoster(){if(!catalog)return;const q=$('teamSearch').value.trim().toLowerCase(),list=Object.values(catalog.entities||{}).filter(e=>{const d=e.definition||{},hay=[e.name,...(d.types||[]).map(t=>TYPE_NAMES[t]||t),...(d.tags||[])].join(' ').toLowerCase();return !q||hay.includes(q)}).sort((a,b)=>a.name.localeCompare(b.name));$('roster').innerHTML=list.map(entityCard).join('')||'<p>No hay resultados.</p>';$('roster').querySelectorAll('[data-entity]').forEach(b=>b.onclick=()=>toggleTeam(b.dataset.entity));renderTeam();}
function toggleTeam(id){if(teamSaved)return;const i=team.indexOf(id);if(i>=0)team.splice(i,1);else if(team.length<8)team.push(id);renderRoster();}
function renderTeam(){$('teamCount').textContent=team.length+' / 8';$('teamChips').innerHTML=team.map((id,i)=>`<span class="chip">${i===0?'★ ':''}${esc(entity(id)?.name||id)}${teamSaved?'':` <button data-remove="${esc(id)}">×</button>`}</span>`).join('');$('teamChips').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>toggleTeam(b.dataset.remove));$('saveTeam').disabled=teamSaved||team.length!==8;$('ready').disabled=!teamSaved;}
$('teamSearch').oninput=renderRoster;$('saveTeam').onclick=()=>{if(team.length!==8)return;send({type:'team',team});teamSaved=true;localStorage.setItem('ud-alpha-team',JSON.stringify(team));renderRoster();$('teamStatus').textContent='Equipo enviado. Ahora podés marcarte listo.';$('ready').disabled=false};$('ready').onclick=()=>{const me=room?.players?.find(p=>p.role===role),next=!me?.ready;send({type:'ready',ready:next});$('ready').disabled=true};
function send(data){if(ws?.readyState===1)ws.send(JSON.stringify(data))}
async function createRoom(){try{const name=$('name').value.trim()||'Jugador';localStorage.setItem('ud-alpha-name',name);$('homeStatus').textContent='Creando sala…';const r=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}),d=await r.json();if(!r.ok)throw Error(d.error);connect(d.code,name)}catch(e){$('homeStatus').textContent=e.message;$('homeStatus').className='status error'}}
function connect(code,name){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){$('homeStatus').textContent='Código inválido.';return;}localStorage.setItem('ud-alpha-name',name);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/api/rooms/${code}?name=${encodeURIComponent(name)}`);$('homeStatus').textContent='Conectando…';ws.onopen=()=>{$('home').classList.add('hidden');$('lobby').classList.remove('hidden')};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>{$('roomStatus').textContent=battle?.status==='playing'?'Conexión perdida. Recargá y volvé a entrar con el mismo código.':'Conexión cerrada.'};}
$('create').onclick=createRoom;$('join').onclick=()=>connect($('joinCode').value,$('name').value.trim()||'Jugador');$('copyCode').onclick=()=>navigator.clipboard?.writeText(room?.code||'');
function handle(m){
 if(m.type==='welcome'){role=m.role;$('roomCode').textContent=m.code;$('battlePerspective').value=role==='guest'?'right':'left';return}
 if(m.type==='room'){room=m.room;renderRoom();return}
 if(m.type==='error'){if(pendingSendTimer){clearTimeout(pendingSendTimer);pendingSendTimer=null;}pendingLocalOrder=null;actionLocked=false;if(battle){displayedBattleLog.push('Error: '+m.message);renderBattle(battleDisplayData||battle.state,'Error: '+m.message)}else $('roomStatus').textContent=m.message;return}
 if(m.type==='notice'){$('roomStatus').textContent=m.message;return}
 if(m.type==='selection_accepted'){return}
 if(m.type==='battle_selection'){const both=!!m.host&&!!m.guest;if(both&&pendingLocalOrder&&!actionLocked)scheduleOrderSend();else if(!both&&pendingSendTimer){clearTimeout(pendingSendTimer);pendingSendTimer=null;}return}
 if(m.type==='order_accepted'){actionLocked=true;pendingLocalOrder=null;renderBattle(battleDisplayData||battle?.state,'Esperando la acción del rival…');return}
 if(m.type==='battle_waiting'){return}
 if(['battle_start','battle_round','battle_result','battle_sync'].includes(m.type)){receiveBattle(m);return}
}
function renderRoom(){if(!room)return;$('players').innerHTML=['host','guest'].map(r=>{const p=room.players.find(x=>x.role===r);return `<div class="player-card"><div><span class="dot ${p?.connected?'on':''}"></span><strong>${esc(p?.name||'Esperando jugador…')}</strong>${r===role?' · Vos':''}</div><small>${p?`${p.teamCount}/8 · ${p.ready?'Listo':'No listo'}`:'Sin conectar'}</small></div>`}).join('');const me=room.players.find(p=>p.role===role);if(me){teamSaved=me.teamCount===8;if(me.ready){$('ready').textContent='Cancelar listo';$('ready').disabled=false}else{$('ready').textContent='Estoy listo';$('ready').disabled=!teamSaved}}$('roomStatus').textContent=room.players.length<2?'Compartí el código con tu rival.':room.players.every(p=>p.ready)?'Iniciando batalla…':'Seleccionen sus equipos y márquense listos.';renderTeam();}

/* Batalla: comportamiento visual del laboratorio */
let battleLastData=null,battleDisplayData=null,battleAnimating=false,battleSpeed='normal',displayedBattleLog=[],battleModalKind='',battleInfoMode=false,pendingLocalOrder=null,pendingSendTimer=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),speedFactor=()=>({normal:1,fast:.58,x2:.34}[battleSpeed]||1),wait=ms=>sleep(Math.round(ms*speedFactor())),cloneBattle=v=>structuredClone(v);
async function ensureBattleCatalog(rev){if(rev&&rev!==revision)await loadCatalog(rev)}
function playerSide(){return $('battlePerspective')?.value||(role==='guest'?'right':'left')}
function perspectiveUnits(data){const left=playerSide()==='left';return {player:left?data.left:data.right,enemy:left?data.right:data.left,playerSide:left?'left':'right',playerTeam:left?data.leftTeam:data.rightTeam,enemyTeam:left?data.rightTeam:data.leftTeam};}
function battleEntityEntry(id){return entity(id)}
function battleUnitHTML(unit,viewRole){const url=spriteUrl(unit?.id,battle?.revision),pct=unit?.maxHp?Math.max(0,unit.hp/unit.maxHp*100):0;return `<div class="battle-unit ${viewRole}" data-role="${viewRole}"><div class="battle-nameplate"><strong><span>${esc(unit?.name||'—')}</span><span>${(unit?.types||[]).map(esc).join(' / ')}</span></strong><div class="battle-hp-track"><div class="battle-hp-fill" style="width:${pct}%"></div></div><div class="battle-hp-text">${unit?.hp??0} / ${unit?.maxHp??0} PS</div></div><div class="battle-sprite-window">${url?`<img class="battle-sprite-sheet" src="${url}" alt="Sprite de ${esc(unit.name)}">`:'<div class="battle-empty">Sin sprite</div>'}</div></div>`;}
function renderBattle(data,message=''){if(!data)return;battleLastData=data;const p=perspectiveUnits(data),controls=manualControlsHTML(data),narration=controls?'':`<div class="battle-message" id="battleMessage">${esc(message||(battle?.status==='finished'?'Batalla terminada.':'Ronda '+(battle?.round||data.rounds||1)))}</div>`;$('battleStage').innerHTML=battleUnitHTML(p.enemy,'enemy')+battleUnitHTML(p.player,'player')+narration+controls;$('roundLabel').textContent=battle?.status==='playing'?`Ronda ${battle.round}`:'Batalla terminada';wireManualControl();}
function manualControlsHTML(data){if(!battle||battle.status!=='playing'||battleAnimating||actionLocked)return '';const p=perspectiveUnits(data),unit=p.player,entry=battleEntityEntry(unit.id),ids=[...(entry?.definition?.moveIds||[]),entry?.definition?.uniqueMoveId].filter(Boolean),selected=pendingLocalOrder?.move,hasChoice=!!pendingLocalOrder,info=battleInfoMode;const buttons=ids.map(id=>{const m=move(id),d=m?.definition||{},cd=unit.cooldowns?.[id]||0;const normal=`<strong>${esc(m?.name||id)}${cd>0?`<span class="cooldown">CD ${cd}</span>`:''}</strong><small>${esc(d.type||'—')} · ${esc(({physical:'Físico',special:'Especial',status:'Estado'})[d.category]||d.category||'—')}</small>`;const detail=`<strong>${esc(m?.name||id)}</strong><small>${esc(m?.description||'Sin descripción')}<br>Pot. ${esc(d.power??'—')} · Prec. ${Number(d.accuracy)===0?'Nunca falla':esc(d.accuracy??'—')+'%'} · Crít. ${esc(d.criticalChance??'—')}% · Prio. ${esc(d.priority??0)} · CD base ${esc(d.cooldown??0)}</small>`;return `<button type="button" class="battle-move ${info?'show-info':''} ${selected===id?'chosen':''}" data-move="${esc(id)}" ${(cd>0||hasChoice)?'disabled':''}>${info?detail:normal}</button>`}).join('');const leftTop=hasChoice?'<button type="button" id="battleCancelMove">Cancelar</button>':`<button type="button" id="battleMoveInfo" aria-pressed="${info}">Info</button>`;const switchLabel=pendingLocalOrder?.switch!==undefined?'Cambio elegido':'Cambiar';return `<div class="battle-command-left">${leftTop}<button type="button" id="battleSwitch" ${hasChoice?'disabled':''}>${switchLabel}</button></div><div class="battle-actions"><div class="battle-move-grid">${buttons}</div></div>`;}
function scheduleOrderSend(){if(pendingSendTimer)clearTimeout(pendingSendTimer);pendingSendTimer=setTimeout(()=>{pendingSendTimer=null;if(!pendingLocalOrder||actionLocked||battle?.status!=='playing')return;const order={...pendingLocalOrder};actionLocked=true;renderBattle(battleDisplayData||battleLastData,'Esperando la acción del rival…');send({type:'order',order});},900);}
function cancelPendingOrder(){if(pendingSendTimer){clearTimeout(pendingSendTimer);pendingSendTimer=null;}pendingLocalOrder=null;send({type:'cancel_selection'});renderBattle(battleDisplayData||battleLastData,'');}
function selectLocalOrder(order){pendingLocalOrder=order;send({type:'select_order',order});renderBattle(battleLastData,'');}
function openSwitchPicker(){const p=perspectiveUnits(battleLastData),team=p.playerTeam||[],active=p.player,title=$('battleModalTitle'),body=$('battleModalBody');title.textContent='Cambiar personaje';const choices=team.map((u,index)=>({u,index})).filter(x=>x.u.id!==active.id&&x.u.hp>0);body.innerHTML=choices.length?choices.map(({u,index})=>`<button type="button" class="battle-switch-choice" data-switch-index="${index}"><strong>${esc(u.name)}</strong> · ${u.hp}/${u.maxHp} PS</button>`).join(''):'<p>No hay otro personaje disponible para cambiar.</p>';body.querySelectorAll('.battle-switch-choice').forEach(b=>b.addEventListener('click',()=>{selectLocalOrder({switch:Number(b.dataset.switchIndex)});$('battleModal').hidden=true;}));$('battleModal').hidden=false;}
function wireManualControl(){document.querySelectorAll('.battle-move').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;selectLocalOrder({move:b.dataset.move});}));$('battleCancelMove')?.addEventListener('click',cancelPendingOrder);$('battleMoveInfo')?.addEventListener('click',()=>{battleInfoMode=!battleInfoMode;renderBattle(battleLastData,'');});$('battleSwitch')?.addEventListener('click',openSwitchPicker);}
function findMoveByName(name){return Object.values(catalog?.moves||{}).find(m=>m.name===name)}
function battleIdentity(raw){const text=String(raw||'');if(text.startsWith('@@L@@'))return {side:'left',name:text.slice(5)};if(text.startsWith('@@R@@'))return {side:'right',name:text.slice(5)};return {side:'',name:text};}
function battleDisplayName(side,name){return side&&side!==playerSide()?name+' (oponente)':name}
function formatBattleLine(line,data=battleDisplayData){let out=String(line||'');for(const [side,mark,key] of [['left','@@L@@','leftTeam'],['right','@@R@@','rightTeam']]){const units=(data?.[key]||[data?.[side]]).filter(Boolean).slice().sort((a,b)=>(b.name||'').length-(a.name||'').length);for(const u of units)out=out.split(mark+u.name).join(battleDisplayName(side,u.name));out=out.split(mark).join('');}return out;}
function hpDom(side,hp,maxHp){const p=perspectiveUnits(battleDisplayData),viewRole=side===p.playerSide?'player':side?'enemy':null;if(!viewRole)return;const root=document.querySelector('.battle-unit.'+viewRole);if(!root)return;const fill=root.querySelector('.battle-hp-fill'),txt=root.querySelector('.battle-hp-text');if(fill)fill.style.width=Math.max(0,hp/maxHp*100)+'%';if(txt)txt.textContent=hp+' / '+maxHp+' PS';}
function changeDisplayedHp(identity,delta){const parsed=battleIdentity(identity);if(parsed.side){const u=battleDisplayData?.[parsed.side];if(u){u.hp=Math.max(0,Math.min(u.maxHp,u.hp+delta));hpDom(parsed.side,u.hp,u.maxHp);}return;}const matches=['left','right'].filter(k=>battleDisplayData?.[k]?.name===parsed.name);if(matches.length===1){const k=matches[0],u=battleDisplayData[k];u.hp=Math.max(0,Math.min(u.maxHp,u.hp+delta));hpDom(k,u.hp,u.maxHp);}}
function refreshOpenEffectsModal(){const modal=$('battleModal');if(!modal||modal.hidden||!['player','enemy'].includes(battleModalKind))return;const p=perspectiveUnits(battleDisplayData),unit=battleModalKind==='player'?p.player:p.enemy,title=$('battleModalTitle'),body=$('battleModalBody');title.textContent='Efectos · '+unit.name;body.innerHTML=effectRows(unit);wireEffectDetails(unit);}
function applyVisualEvent(event,currentMessage=''){if(!event?.side||!event?.unit||!battleDisplayData)return;const side=event.side,unit=cloneBattle(event.unit);battleDisplayData[side]=unit;const teamKey=side==='left'?'leftTeam':'rightTeam';if(Array.isArray(battleDisplayData[teamKey])){const idx=battleDisplayData[teamKey].findIndex(x=>x.id===unit.id);if(idx>=0)battleDisplayData[teamKey][idx]=cloneBattle(unit);}if(event.type==='switch'){renderBattle(battleDisplayData,currentMessage);return;}refreshOpenEffectsModal();}
function applyVisualLine(line){let m=line.match(/^(.+?) recibe (\d+) de daño(?: adicional)?(?: \([^)]*\))?\.$/);if(m){changeDisplayedHp(m[1],-Number(m[2]));return;}m=line.match(/^.+?: (.+?) pierde (\d+) PS/);if(m){changeDisplayedHp(m[1],-Number(m[2]));return;}m=line.match(/^(.+?) recupera (\d+) PS/);if(m){changeDisplayedHp(m[1],Number(m[2]));return;}m=line.match(/^.+?: (.+?) recupera (\d+) PS/);if(m)changeDisplayedHp(m[1],Number(m[2]));}
async function animateLogLines(lines,finalData,visualEvents=[]){battleAnimating=true;document.querySelector('.battle-actions')?.remove();document.querySelector('.battle-command-left')?.remove();const eventsByLocal=new Map();for(const e of visualEvents){const i=Number(e.localIndex);if(!eventsByLocal.has(i))eventsByLocal.set(i,[]);eventsByLocal.get(i).push(e);}for(let lineIndex=0;lineIndex<lines.length;lineIndex++){const line=lines[lineIndex],use=line.match(/^(.+?) usó (.+?)\.$/);if(use){let msg=$('battleMessage');if(!msg){msg=document.createElement('div');msg.className='battle-message';msg.id='battleMessage';$('battleStage').append(msg);}msg.textContent=formatBattleLine(line,battleDisplayData);displayedBattleLog.push(line);for(const e of eventsByLocal.get(lineIndex)||[])applyVisualEvent(e,msg.textContent);await wait(650);const ident=battleIdentity(use[1]),mv=findMoveByName(use[2]),p=perspectiveUnits(battleDisplayData),viewRole=ident.side?(ident.side===p.playerSide?'player':'enemy'):(ident.name===p.player.name?'player':'enemy'),other=viewRole==='player'?'enemy':'player',el=document.querySelector('.battle-unit.'+viewRole),target=document.querySelector('.battle-unit.'+other),cat=mv?.definition?.category||'status';el?.classList.add(cat==='physical'?'anim-physical':cat==='special'?'anim-special':'anim-status');await wait(cat==='status'?1300:1150);el?.classList.remove('anim-physical','anim-special','anim-status');if(cat==='special'){await wait(250);target?.classList.add('anim-hit');await wait(800);target?.classList.remove('anim-hit');}await wait(350);continue;}let msg=$('battleMessage');if(!msg){msg=document.createElement('div');msg.className='battle-message';msg.id='battleMessage';$('battleStage').append(msg);}msg.textContent=formatBattleLine(line,battleDisplayData);displayedBattleLog.push(line);applyVisualLine(line);for(const e of eventsByLocal.get(lineIndex)||[])applyVisualEvent(e,msg.textContent);if(/recibe \d+ de daño|falló|crítico|estado|recupera|pierde|inmune|cooldown|volver a usar/i.test(line))await wait(1350);else if(/debilitado|fuera de combate|entra|termina/i.test(line))await wait(1650);else await wait(900);}battleDisplayData=cloneBattle(finalData);battleLastData=battleDisplayData;battleAnimating=false;actionLocked=!!battle?.submitted;renderBattle(battleDisplayData,'');}
function statusEffectText(statusId){const st=catalog?.statuses?.[statusId];if(!st)return 'Estado no encontrado.';const names={attack:'Ataque',specialAttack:'Ataque especial',defense:'Defensa',specialDefense:'Defensa especial',speed:'Velocidad',accuracy:'Precisión',evasion:'Evasión',criticalChance:'Probabilidad de crítico'};return (st.definition?.rules||[]).map(r=>{const a=r.action||{};if(a.type==='damage')return `−${a.value}% PS al final del turno`;if(a.type==='heal')return `+${a.value}% PS al final del turno`;if(a.type==='stat_change')return `${Number(a.value)>0?'+':''}${a.value} ${names[a.stat]||a.stat}`;return `${a.type}${a.value!==''&&a.value!=null?' · '+a.value:''}`}).join('\n')||'Sin efectos configurados.';}
function statBreakdown(unit,stat){const names={attack:'Ataque',specialAttack:'Ataque especial',defense:'Defensa',specialDefense:'Defensa especial',speed:'Velocidad',accuracy:'Precisión',evasion:'Evasión',criticalChance:'Probabilidad de crítico'},rows=[];for(const x of unit?.statSources||[])if(x.stat===stat)rows.push(`${x.value>0?'+':''}${x.value} · ${x.sourceName} · ${x.sourceActor===unit.name?'propio':'de '+x.sourceActor}`);if(unit?.status&&unit?.statusStages?.[stat]){const st=catalog?.statuses?.[unit.status.id];rows.push(`${unit.statusStages[stat]>0?'+':''}${unit.statusStages[stat]} · ${st?.name||unit.status.id} · estado alterado`);}for(const [key,cat,label] of [['weather','weathers','clima'],['field','fields','campo'],['scenario','scenarios','escenario']]){const id=battleLastData?.[key],e=catalog?.[cat]?.[id];for(const fx of e?.definition?.fieldEffects||[])if(fx.type==='stat_change'&&fx.stat===stat){const matched=(fx.types||[]).some(t=>unit.types?.includes(t)),ok=fx.filter==='all'||fx.filter==='include'&&matched||fx.filter==='exclude'&&!matched;if(ok)rows.push(`${Number(fx.value)>0?'+':''}${fx.value} · ${e.name} · ${label}`);}}return `<h3>${names[stat]||stat}</h3>${rows.map(x=>`<div class="environment-effect">${esc(x)}</div>`).join('')||'<p>Sin fuentes registradas.</p>'}`;}
function effectRows(unit){const names={attack:'Ataque',specialAttack:'Ataque especial',defense:'Defensa',specialDefense:'Defensa especial',speed:'Velocidad',accuracy:'Precisión',evasion:'Evasión',criticalChance:'Probabilidad de crítico'};let a=[];const core=['attack','defense','specialAttack','specialDefense','speed'];if(unit?.baseStats&&unit?.currentStats)a.push(`<div class="stat-comparison"><strong>Stats base → actuales</strong>${core.map(k=>`<div><span>${names[k]}</span><span>${unit.baseStats[k]} → <b>${unit.currentStats[k]}</b></span></div>`).join('')}</div>`);if(unit?.status){const st=catalog?.statuses?.[unit.status.id];a.push(`<button type="button" class="effect-chip battle-effect-detail" data-status="${esc(unit.status.id)}">${esc(st?.name||unit.status.id)}${unit.status.turns?' · '+unit.status.turns+' r.':''}</button>`);}for(const k of Object.keys(names)){const v=(unit?.stages?.[k]||0)+(unit?.environmentStages?.[k]||0)+(unit?.statusStages?.[k]||0);if(v)a.push(`<button type="button" class="effect-chip battle-effect-detail" data-stat="${esc(k)}">${names[k]}: ${v>0?'+':''}${v}</button>`);}if(unit?.environmentCrit)a.push(`<button type="button" class="effect-chip battle-effect-detail" data-stat="criticalChance">Crítico: ${unit.environmentCrit>0?'+':''}${unit.environmentCrit/5}</button>`);for(const e of unit?.effects||[])a.push(`<span class="effect-chip">${esc(e.id)}${e.turns?' · '+e.turns+' r.':''}</span>`);return a.join('')||'<p>No tiene efectos aplicados.</p>';}
function environmentEffectText(e){const stats={attack:'Ataque',specialAttack:'Ataque especial',defense:'Defensa',specialDefense:'Defensa especial',speed:'Velocidad',accuracy:'Precisión',evasion:'Evasión',criticalChance:'Probabilidad de crítico'},types={damage_percent:'Daño',heal_percent:'Curación',stat_change:'Cambio de estadística',critical_change:'Cambio de crítico',remove_status:'Elimina alteraciones de estado',block_status:'Elimina e impide alteraciones de estado',cooldown_change:'Modifica cooldowns activos',cooldown_on_use:'Cooldown adicional al usar movimientos',immunity:'Inmunidad al daño'};let parts=[types[e.type]||e.type];if(e.type==='damage_percent'||e.type==='heal_percent')parts.push(`${e.value} % de PS máximos`);if(e.type==='stat_change')parts.push(`${stats[e.stat]||e.stat}: ${Number(e.value)>0?'+':''}${e.value} niveles`);if(e.type==='cooldown_change'||e.type==='cooldown_on_use')parts.push(`${Number(e.value)>0?'+':''}${e.value} turno(s)`);if(e.type==='critical_change')parts.push(`${Number(e.value)>0?'+':''}${Number(e.value)*(Number(e.value)>0?10:5)} %`);if(e.type==='immunity')parts.push(e.damageClass==='physical'?'Solo físico':e.damageClass==='special'?'Solo especial':'Todo daño');if(e.chance!==undefined)parts.push(`Probabilidad: ${e.chance} %`);if(e.filter==='include')parts.push(`Solo tipos: ${(e.types||[]).join(', ')}`);else if(e.filter==='exclude')parts.push(`Excepto tipos: ${(e.types||[]).join(', ')}`);else parts.push('Afecta a todos los activos');return parts.join(' · ');}
function envBody(){if(!battleLastData)return '<p>Sin batalla.</p>';const kinds=[['Clima','weather','weathers','weatherTurns'],['Campo','field','fields','fieldTurns'],['Escenario','scenario','scenarios','scenarioTurns']];return kinds.map(([label,key,cat,turnKey])=>{const id=battleLastData[key],e=catalog?.[cat]?.[id];if(!id)return `<div class="environment-card"><h4>${label}</h4><p>Ninguno activo.</p></div>`;const fx=(e?.definition?.fieldEffects||[]).map(x=>`<span class="environment-effect">${esc(environmentEffectText(x))}</span>`).join('');return `<div class="environment-card"><h4>${label}: ${esc(e?.name||'Sin nombre')}</h4><p>${battleLastData[turnKey]!==undefined?esc(battleLastData[turnKey])+' rondas restantes':'Activo'}</p>${fx||'<p>Sin efectos configurados.</p>'}</div>`;}).join('');}
function logBody(){const lines=displayedBattleLog||[];let out='',open=false;for(const l of lines){if(l.startsWith('— Ronda ')){if(open)out+='</div>';out+=`<div class="battle-log-round"><strong>${esc(formatBattleLine(l,battleLastData))}</strong>`;open=true}else out+=`<div>${esc(formatBattleLine(l,battleLastData))}</div>`;}return out+(open?'</div>':'');}
function wireEffectDetails(unit){const title=$('battleModalTitle'),body=$('battleModalBody');body.querySelectorAll('.battle-effect-detail').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.status){const st=catalog?.statuses?.[b.dataset.status];title.textContent=st?.name||b.dataset.status;body.innerHTML='<pre style="white-space:pre-wrap">'+esc(statusEffectText(b.dataset.status))+'</pre>';}else if(b.dataset.stat){title.textContent='Desglose · '+unit.name;body.innerHTML=statBreakdown(unit,b.dataset.stat);}}));}
function openBattleModal(kind){if(!battleLastData)return;battleModalKind=kind;const p=perspectiveUnits(battleLastData),title=$('battleModalTitle'),body=$('battleModalBody');let unit=null;if(kind==='player'){unit=p.player;title.textContent='Efectos · '+unit.name;body.innerHTML=effectRows(unit);wireEffectDetails(unit)}else if(kind==='enemy'){unit=p.enemy;title.textContent='Efectos · '+unit.name;body.innerHTML=effectRows(unit);wireEffectDetails(unit)}else if(kind==='environment'){title.textContent='Efectos del entorno';body.innerHTML=envBody()}else{title.textContent='Battle log';body.innerHTML=logBody()}$('battleModal').hidden=false;}
document.querySelectorAll('[data-battle-modal]').forEach(b=>b.addEventListener('click',()=>openBattleModal(b.dataset.battleModal)));$('battleModalClose').onclick=()=>$('battleModal').hidden=true;$('battleModal').addEventListener('click',e=>{if(e.target.id==='battleModal')e.currentTarget.hidden=true;});document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{battleSpeed=b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));$('surrender').onclick=()=>{if(confirm('¿Rendirse de esta batalla?'))send({type:'surrender'})};
async function receiveBattle(m){battle=m.battle;if(!battle)return;await ensureBattleCatalog(battle.revision);$('lobby').classList.add('hidden');$('battleView').classList.remove('hidden');if(pendingSendTimer){clearTimeout(pendingSendTimer);pendingSendTimer=null;}pendingLocalOrder=null;actionLocked=!!battle.submitted;if(m.type==='battle_sync'){battleDisplayData=cloneBattle(battle.state);battleLastData=battleDisplayData;displayedBattleLog=[...(battle.recentLog||[])];renderBattle(battleDisplayData,battle.status==='playing'?(actionLocked?'Esperando la acción del rival…':''):'Batalla terminada.');if(battle.status==='finished')showResult();return;}if(!battleDisplayData){battleDisplayData=cloneBattle(battle.state);battleLastData=battleDisplayData;renderBattle(battleDisplayData,'Comienza la batalla.');}const start=Number(m.logStart||0),events=(m.visualEvents||[]).map(e=>({...e,localIndex:Number(e.logIndex)-start}));await animateLogLines(m.logs||[],battle.state,events);if(battle.status==='finished')showResult();}
function showResult(){actionLocked=true;pendingLocalOrder=null;const won=battle.winner===role,msg=battle.finishReason==='surrender'?(won?'El rival se rindió.':'Te rendiste.'):(won?'¡Ganaste la batalla!':'Perdiste la batalla.');renderBattle(battleDisplayData||battle.state,msg);}
(async()=>{try{$('name').value=localStorage.getItem('ud-alpha-name')||'';const saved=JSON.parse(localStorage.getItem('ud-alpha-team')||'[]');await loadCatalog();team=saved.filter(id=>catalog.entities[id]).slice(0,8);renderRoster();$('homeStatus').textContent=`Contenido ${revision} cargado.`;$('homeStatus').className='status good'}catch(e){$('homeStatus').textContent='Alpha no disponible: '+e.message;$('homeStatus').className='status error';$('create').disabled=$('join').disabled=true}})();
</script></body></html>
