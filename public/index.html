<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11131d"><title>Universal Duels — Alpha 0.1</title>
<style>
:root{--bg:#0e1018;--panel:#1b1e2c;--panel2:#25293b;--line:#3a3f57;--text:#f4f2ff;--muted:#a9acc2;--accent:#a99bff;--good:#72dfae;--warn:#f5c66b;--bad:#ef7889}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#292744,#0e1018 52%);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#30344a;color:white;border-radius:10px;padding:10px 13px;font-weight:700}button:hover{border-color:#7770a7}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#5c5193;border-color:#897bd5}.danger{background:#572c38;border-color:#864352}.ghost{background:transparent}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}.badge{padding:6px 10px;border:1px solid #6d6594;border-radius:999px;color:#d9d2ff;font-size:12px}.panel{background:linear-gradient(160deg,#202334,#171a27);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 15px 40px #0003}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{width:100%;padding:12px;border:1px solid #454a65;border-radius:10px;background:#11131d;color:white}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.status{min-height:22px;color:var(--muted)}.error{color:#ff9aa8}.good{color:#8de9c0}.roomcode{font-size:24px;letter-spacing:5px;font-weight:900}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#151824}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:6px}.dot.on{background:var(--good)}.team-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:16px}.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;max-height:480px;overflow:auto;padding-right:4px}.entity{display:flex;gap:9px;align-items:center;text-align:left;background:#171a26;padding:9px}.entity.selected{border-color:var(--accent);background:#282642}.thumb{width:54px;height:54px;overflow:hidden;position:relative;flex:none}.thumb img{position:absolute;height:54px;width:108px;left:0;image-rendering:pixelated;object-fit:fill}.entity strong{display:block}.types{font-size:11px;color:#b6b4ca}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 9px;border-radius:999px;background:#302f45;border:1px solid #4d4b68;font-size:12px}.chip button{padding:0 0 0 5px;border:0;background:none}.team-count{font-weight:800;color:#ded8ff}.battle{position:relative;min-height:650px;overflow:hidden;background:linear-gradient(#22273a 0 48%,#343044 48% 50%,#1c2430 50%);border-radius:16px;border:1px solid #444861}.battle-unit{position:absolute;width:min(37%,330px);transition:transform .22s ease,filter .2s}.battle-unit.enemy{right:7%;top:6%}.battle-unit.player{left:7%;bottom:20%}.nameplate{background:#f1eee7;color:#20212b;border:4px solid #333642;border-radius:13px;padding:8px 11px;box-shadow:0 5px 0 #0005}.nameplate .head{display:flex;justify-content:space-between;gap:9px;font-weight:850}.hpbar{height:12px;border:2px solid #2b2d36;border-radius:9px;background:#7a3340;overflow:hidden;margin-top:6px}.hpfill{height:100%;background:#57b975;transition:width .35s}.hptext{text-align:right;font-size:11px;margin-top:2px}.sprite-window{width:190px;height:190px;overflow:hidden;position:relative;margin:auto;filter:drop-shadow(0 13px 7px #0008)}.sprite-sheet{position:absolute;top:0;width:380px;height:190px;object-fit:fill;image-rendering:pixelated}.enemy .sprite-sheet{left:0}.player .sprite-sheet{left:-190px}.empty-sprite{height:100%;display:grid;place-items:center;color:#999}.narration{position:absolute;z-index:5;left:4%;right:4%;bottom:3%;min-height:78px;background:#f6f3ea;color:#20212a;border:5px double #343743;border-radius:12px;padding:13px 17px;font-weight:750;font-size:16px}.actions{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;display:grid;grid-template-columns:130px 1fr;gap:9px;background:#151823dd;border:1px solid #45495f;border-radius:14px;padding:10px;backdrop-filter:blur(7px)}.action-left{display:grid;gap:7px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:7px}.move{text-align:left;min-height:58px}.move small{display:block;color:#bab9ca;font-weight:500}.waiting{position:absolute;z-index:7;inset:auto 4% 3%;padding:17px;background:#171a25e8;border:1px solid #45495f;border-radius:13px;text-align:center}.battle-side{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:14px}.effect-box,.log{background:#151824;border:1px solid var(--line);border-radius:12px;padding:12px}.statrow{display:flex;justify-content:space-between;border-bottom:1px solid #2c3041;padding:5px 0}.log{max-height:310px;overflow:auto;font-size:12px;color:#c8c9d6}.log div{padding:4px 0;border-bottom:1px solid #242737}.switch-list{display:grid;gap:7px}.switch-option{text-align:left}.attack-player{transform:translate(70px,-20px)}.attack-enemy{transform:translate(-70px,20px)}.hit{filter:brightness(1.9);transform:translateX(8px)}.modal{position:fixed;z-index:30;inset:0;background:#070811cc;display:grid;place-items:center;padding:16px}.modal-card{width:min(620px,100%);max-height:80vh;overflow:auto;background:#1e2131;border:1px solid #535875;border-radius:16px;padding:18px}@media(max-width:760px){.grid2,.team-layout,.battle-side{grid-template-columns:1fr}.players{grid-template-columns:1fr}.battle{min-height:610px}.battle-unit{width:46%}.battle-unit.enemy{right:2%}.battle-unit.player{left:2%}.sprite-window{width:145px;height:145px}.sprite-sheet{width:290px;height:145px}.player .sprite-sheet{left:-145px}.actions{grid-template-columns:95px 1fr}.moves{grid-template-columns:1fr 1fr}.battle-side{display:block}.effect-box{margin-bottom:10px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><h1>Universal Duels</h1><small>Combates por turnos · Alpha pública</small></div><span class="badge">Alpha 0.1</span></header>
<section id="home" class="panel"><h2>Entrar a una batalla</h2><p style="color:var(--muted)">Creá una sala privada o entrá con el código de otra persona.</p><div class="grid2"><div class="field"><label>Tu nombre</label><input id="name" maxlength="20" placeholder="Jugador"></div><div class="field"><label>Código para unirte</label><input id="joinCode" maxlength="6" placeholder="ABC234" style="text-transform:uppercase"></div></div><div class="row" style="margin-top:12px"><button id="create" class="primary">Crear sala</button><button id="join">Unirme</button></div><p id="homeStatus" class="status"></p></section>
<section id="lobby" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><small style="color:var(--muted)">Sala</small><div id="roomCode" class="roomcode"></div></div><button id="copyCode">Copiar código</button></div><div id="players" class="players" style="margin-top:12px"></div><p id="roomStatus" class="status"></p></div>
<div class="panel"><h2>Tu equipo</h2><div class="team-layout"><div><div class="field"><label>Buscar personaje</label><input id="teamSearch" type="search" placeholder="Nombre, tipo o etiqueta"></div><div id="roster" class="roster" style="margin-top:10px"></div></div><div><div class="row" style="justify-content:space-between"><strong>Seleccionados</strong><span id="teamCount" class="team-count">0 / 8</span></div><p style="font-size:12px;color:var(--muted)">El primero será tu personaje activo inicial.</p><div id="teamChips" class="chips"></div><div class="row" style="margin-top:14px"><button id="saveTeam" class="primary">Guardar equipo</button><button id="ready" disabled>Estoy listo</button></div><p id="teamStatus" class="status"></p></div></div></div></section>
<section id="battleView" class="hidden"><div id="battleArena" class="battle"><div id="enemyUnit"></div><div id="playerUnit"></div><div id="narration" class="narration hidden"></div><div id="actions" class="actions hidden"></div><div id="waiting" class="waiting hidden">Esperando la acción del rival…</div></div><div class="battle-side"><div id="effects" class="effect-box"></div><div><div class="row" style="margin-bottom:8px"><button id="surrender" class="danger">Rendirse</button><span id="roundLabel" style="color:var(--muted)"></span></div><div id="battleLog" class="log"></div></div></div></section>
</div><div id="modal" class="modal hidden"><div class="modal-card"><div class="row" style="justify-content:space-between"><h3 id="modalTitle" style="margin:0">Cambiar</h3><button id="closeModal">Cerrar</button></div><div id="modalBody" style="margin-top:12px"></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog=null,revision=null,ws=null,role=null,room=null,battle=null,displayState=null,team=[],teamSaved=false,actionLocked=false;
const TYPE_NAMES={fuego:'Fuego',planta:'Planta',roca:'Roca',hielo:'Hielo',rayo:'Rayo',metal:'Metal',guerra:'Guerra',mente:'Mente',encanto:'Encanto',espectro:'Espectro',divinidad:'Divinidad',luz:'Luz',oscuridad:'Oscuridad',viento:'Viento',dragon:'Dragón',agua:'Agua',veneno:'Veneno',tecnologia:'Tecnología',agilidad:'Agilidad',valor:'Valor'};
async function loadCatalog(rev=''){const r=await fetch('/api/catalog'+(rev?'/'+encodeURIComponent(rev):'')),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'No se pudo cargar el catálogo.');catalog=d.catalog;revision=d.revision;renderRoster();return d;}
function entity(id){return catalog?.entities?.[id]} function move(id){return catalog?.moves?.[id]} function statusName(id){return catalog?.statuses?.[id]?.name||id||'—'}
function spriteUrl(id,rev=revision){const e=entity(id),sid=e?.definition?.spriteId;return sid?'/api/sprites/'+encodeURIComponent(sid)+(rev?'?revision='+encodeURIComponent(rev):''):''}
function entityCard(e){const url=spriteUrl(e.id),d=e.definition||{},selected=team.includes(e.id);return `<button class="entity ${selected?'selected':''}" data-entity="${esc(e.id)}">${url?`<span class="thumb"><img src="${url}" alt=""></span>`:''}<span><strong>${esc(e.name)}</strong><span class="types">${(d.types||[]).map(t=>TYPE_NAMES[t]||t).join(' · ')}</span></span></button>`}
function renderRoster(){if(!catalog)return;const q=$('teamSearch').value.trim().toLowerCase(),list=Object.values(catalog.entities||{}).filter(e=>{const d=e.definition||{},hay=[e.name,...(d.types||[]).map(t=>TYPE_NAMES[t]||t),...(d.tags||[])].join(' ').toLowerCase();return !q||hay.includes(q)}).sort((a,b)=>a.name.localeCompare(b.name));$('roster').innerHTML=list.map(entityCard).join('')||'<p>No hay resultados.</p>';$('roster').querySelectorAll('[data-entity]').forEach(b=>b.onclick=()=>toggleTeam(b.dataset.entity));renderTeam();}
function toggleTeam(id){if(teamSaved)return;const i=team.indexOf(id);if(i>=0)team.splice(i,1);else if(team.length<8)team.push(id);renderRoster();}
function renderTeam(){$('teamCount').textContent=team.length+' / 8';$('teamChips').innerHTML=team.map((id,i)=>`<span class="chip">${i===0?'★ ':''}${esc(entity(id)?.name||id)}${teamSaved?'':` <button data-remove="${esc(id)}">×</button>`}</span>`).join('');$('teamChips').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>toggleTeam(b.dataset.remove));$('saveTeam').disabled=teamSaved||team.length!==8;$('ready').disabled=!teamSaved;}
$('teamSearch').oninput=renderRoster;
$('saveTeam').onclick=()=>{if(team.length!==8)return;send({type:'team',team});teamSaved=true;localStorage.setItem('ud-alpha-team',JSON.stringify(team));renderRoster();$('teamStatus').textContent='Equipo enviado. Ahora podés marcarte listo.';$('ready').disabled=false};
$('ready').onclick=()=>{const me=room?.players?.find(p=>p.role===role),next=!me?.ready;send({type:'ready',ready:next});$('ready').disabled=true};
function send(data){if(ws?.readyState===1)ws.send(JSON.stringify(data))}
async function createRoom(){try{const name=$('name').value.trim()||'Jugador';localStorage.setItem('ud-alpha-name',name);$('homeStatus').textContent='Creando sala…';const r=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}),d=await r.json();if(!r.ok)throw Error(d.error);connect(d.code,name)}catch(e){$('homeStatus').textContent=e.message;$('homeStatus').className='status error'}}
function connect(code,name){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){ $('homeStatus').textContent='Código inválido.';return;}localStorage.setItem('ud-alpha-name',name);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/api/rooms/${code}?name=${encodeURIComponent(name)}`);$('homeStatus').textContent='Conectando…';ws.onopen=()=>{$('home').classList.add('hidden');$('lobby').classList.remove('hidden')};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>{if(battle?.status==='playing')$('roomStatus').textContent='Conexión perdida. Recargá y volvé a entrar con el mismo código.';else $('roomStatus').textContent='Conexión cerrada.'};}
$('create').onclick=createRoom;$('join').onclick=()=>connect($('joinCode').value,$('name').value.trim()||'Jugador');$('copyCode').onclick=()=>navigator.clipboard?.writeText(room?.code||'');
function handle(m){
 if(m.type==='welcome'){role=m.role;$('roomCode').textContent=m.code;return}
 if(m.type==='room'){room=m.room;renderRoom();return}
 if(m.type==='error'){const target=battle?$('battleLog'):$('roomStatus');target.innerHTML+=`<div class="error">${esc(m.message)}</div>`;actionLocked=false;renderActions();return}
 if(m.type==='notice'){$('roomStatus').textContent=m.message;return}
 if(m.type==='order_accepted'){actionLocked=true;$('actions').classList.add('hidden');$('waiting').classList.remove('hidden');return}
 if(m.type==='battle_waiting'){return}
 if(['battle_start','battle_round','battle_result','battle_sync'].includes(m.type)){receiveBattle(m);return}
}
function renderRoom(){if(!room)return;$('players').innerHTML=['host','guest'].map(r=>{const p=room.players.find(x=>x.role===r);return `<div class="player-card"><div><span class="dot ${p?.connected?'on':''}"></span><strong>${esc(p?.name||'Esperando jugador…')}</strong>${r===role?' · Vos':''}</div><small>${p?`${p.teamCount}/8 · ${p.ready?'Listo':'No listo'}`:'Sin conectar'}</small></div>`}).join('');const me=room.players.find(p=>p.role===role);if(me){teamSaved=me.teamCount===8;if(me.ready){$('ready').textContent='Cancelar listo';$('ready').disabled=false}else{$('ready').textContent='Estoy listo';$('ready').disabled=!teamSaved}}$('roomStatus').textContent=room.players.length<2?'Compartí el código con tu rival.':room.players.every(p=>p.ready)?'Iniciando batalla…':'Seleccionen sus equipos y márquense listos.';renderTeam();}
async function ensureBattleCatalog(rev){if(rev&&rev!==revision)await loadCatalog(rev)}
async function receiveBattle(m){battle=m.battle;if(!battle)return;await ensureBattleCatalog(battle.revision);$('lobby').classList.add('hidden');$('battleView').classList.remove('hidden');actionLocked=!!battle.submitted;if(m.type==='battle_sync'){displayState=structuredClone(battle.state);renderBattle();appendLogs(battle.recentLog||[]);return;}if(m.type==='battle_start'){displayState=structuredClone(battle.state);renderBattle();await animateLogs(m.logs||[],m.visualEvents||[],m.logStart||0,true);}else{await animateLogs(m.logs||[],m.visualEvents||[],m.logStart||0,false);displayState=structuredClone(battle.state);renderBattle();}if(battle.status==='finished')showResult();else renderActions();}
function sideData(state){if(!state)return{};return role==='host'?{me:state.left,opp:state.right,myTeam:state.leftTeam,oppTeam:state.rightTeam,mySide:'left',oppSide:'right'}:{me:state.right,opp:state.left,myTeam:state.rightTeam,oppTeam:state.leftTeam,mySide:'right',oppSide:'left'}}
function unitHTML(u,cls){if(!u)return'';const pct=u.maxHp?Math.max(0,u.hp/u.maxHp*100):0,url=spriteUrl(u.id,battle?.revision);return `<div class="battle-unit ${cls}" data-side="${esc(u.side)}"><div class="nameplate"><div class="head"><span>${esc(u.name)}</span><span>${(u.types||[]).map(t=>TYPE_NAMES[t]||t).join('/')}</span></div><div class="hpbar"><div class="hpfill" style="width:${pct}%"></div></div><div class="hptext">${u.hp} / ${u.maxHp} PS · ${pct.toFixed(1)}%</div></div><div class="sprite-window">${url?`<img class="sprite-sheet" src="${url}" alt="${esc(u.name)}">`:'<div class="empty-sprite">Sin sprite</div>'}</div></div>`}
function renderBattle(){const s=sideData(displayState||battle?.state);if(!s.me)return;$('playerUnit').innerHTML=unitHTML(s.me,'player');$('enemyUnit').innerHTML=unitHTML(s.opp,'enemy');$('roundLabel').textContent=battle?.status==='playing'?`Ronda ${battle.round}`:'Batalla terminada';renderEffects(s.me);if(battle?.status==='playing'&&!actionLocked)renderActions();else{$('actions').classList.add('hidden');if(actionLocked)$('waiting').classList.remove('hidden')}}
function renderEffects(u){const labels={attack:'Ataque',defense:'Defensa',specialAttack:'Ataque especial',specialDefense:'Defensa especial',speed:'Velocidad'};$('effects').innerHTML=`<strong>${esc(u.name)} · Estado</strong>${Object.entries(labels).map(([k,l])=>`<div class="statrow"><span>${l}</span><span>${u.baseStats?.[k]??'—'} → <strong>${u.currentStats?.[k]??'—'}</strong>${u.stages?.[k]?` (${u.stages[k]>0?'+':''}${u.stages[k]})`:''}</span></div>`).join('')}<div class="statrow"><span>Alteración</span><span>${esc(u.status?statusName(u.status.id):'Ninguna')}</span></div>`}
function renderActions(){if(!battle||battle.status!=='playing'||actionLocked)return;const {me}=sideData(displayState||battle.state),e=entity(me.id),ids=[...(e?.definition?.moveIds||[]),e?.definition?.uniqueMoveId].filter(Boolean);$('waiting').classList.add('hidden');$('actions').classList.remove('hidden');$('actions').innerHTML=`<div class="action-left"><button id="infoBtn">Info</button><button id="switchBtn">Cambiar</button></div><div class="moves">${ids.map(id=>{const m=move(id),cd=me.cooldowns?.[id]||0;return `<button class="move" data-move="${esc(id)}" ${cd>0?'disabled':''}><strong>${esc(m?.name||id)}</strong><small>${TYPE_NAMES[m?.definition?.type]||m?.definition?.type||''} · ${m?.definition?.category==='physical'?'Físico':m?.definition?.category==='special'?'Especial':'Estado'}${cd?` · CD ${cd}`:''}</small></button>`}).join('')}</div>`;$('actions').querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>choose({move:b.dataset.move}));$('switchBtn').onclick=openSwitch;$('infoBtn').onclick=()=>openMoveInfo(ids);}
function choose(order){if(actionLocked)return;send({type:'order',order});}
function openSwitch(){const {me,myTeam}=sideData(displayState||battle.state),active=myTeam.findIndex(x=>x.id===me.id);$('modalTitle').textContent='Cambiar personaje';$('modalBody').innerHTML=`<div class="switch-list">${myTeam.map((u,i)=>`<button class="switch-option" data-switch="${i}" ${i===active||u.hp<=0?'disabled':''}><strong>${esc(u.name)}</strong><br><small>${u.hp}/${u.maxHp} PS${i===active?' · Activo':''}</small></button>`).join('')}</div>`;$('modal').classList.remove('hidden');$('modalBody').querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{$('modal').classList.add('hidden');choose({switch:Number(b.dataset.switch)})})}
function openMoveInfo(ids){$('modalTitle').textContent='Movimientos';$('modalBody').innerHTML=ids.map(id=>{const m=move(id),d=m?.definition||{};return `<div class="panel"><strong>${esc(m?.name||id)}</strong><p>${esc(m?.description||'')}</p><small>${TYPE_NAMES[d.type]||d.type} · ${d.category} · Potencia ${d.power} · Precisión ${d.accuracy===0?'Nunca falla':d.accuracy+'%'} · Crítico ${d.criticalChance}% · Prioridad ${d.priority} · CD ${d.cooldown||0}</small></div>`}).join('');$('modal').classList.remove('hidden')}
$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('surrender').onclick=()=>{if(confirm('¿Rendirse de esta batalla?'))send({type:'surrender'})};
function formatLog(raw){let line=String(raw);const own=role==='host'?'@@L@@':'@@R@@',opp=role==='host'?'@@R@@':'@@L@@';for(const e of Object.values(catalog?.entities||{}).sort((a,b)=>b.name.length-a.name.length)){line=line.replaceAll(own+e.name,e.name).replaceAll(opp+e.name,e.name+' (oponente)')}return line.replaceAll('@@L@@','').replaceAll('@@R@@','')}
function appendLogs(lines){const box=$('battleLog');for(const raw of lines){const d=document.createElement('div');d.textContent=formatLog(raw);box.append(d)}while(box.children.length>140)box.firstChild.remove();box.scrollTop=box.scrollHeight;}
function detectSide(raw){if(raw.includes('@@L@@'))return'left';if(raw.includes('@@R@@'))return'right';const s=sideData(displayState);if(s.me?.name!==s.opp?.name){if(raw.includes(s.me?.name))return s.mySide;if(raw.includes(s.opp?.name))return s.oppSide}return null}
function patchHpFromLog(raw){if(!displayState)return;const side=detectSide(raw),u=side==='left'?displayState.left:side==='right'?displayState.right:null;if(!u)return;let m=raw.match(/recibe (\d+) de daño/);if(m)u.hp=Math.max(0,u.hp-Number(m[1]));m=raw.match(/recupera (\d+) PS/);if(m)u.hp=Math.min(u.maxHp,u.hp+Number(m[1]));}
function applyVisual(ev){if(!displayState||!ev?.unit)return;const key=ev.side==='left'?'left':'right';displayState[key]=structuredClone(ev.unit);const teamKey=ev.side==='left'?'leftTeam':'rightTeam',idx=displayState[teamKey]?.findIndex(x=>x.id===ev.unit.id);if(idx>=0)displayState[teamKey][idx]=structuredClone(ev.unit);renderBattle()}
async function animateLogs(lines,visualEvents,start=0,initial=false){actionLocked=true;$('actions').classList.add('hidden');$('waiting').classList.add('hidden');const events=[...(visualEvents||[])];for(let i=0;i<lines.length;i++){const raw=lines[i],global=start+i;for(const ev of events.filter(e=>e.logIndex===global&&e.type==='switch'))applyVisual(ev);$('narration').textContent=formatLog(raw);$('narration').classList.remove('hidden');appendLogs([raw]);const side=detectSide(raw);if(/ usó /.test(raw)&&side){const mine=side===(role==='host'?'left':'right'),el=document.querySelector('.battle-unit.'+(mine?'player':'enemy'));el?.classList.add(mine?'attack-player':'attack-enemy');await sleep(300);el?.classList.remove(mine?'attack-player':'attack-enemy')}if(!initial)patchHpFromLog(raw);for(const ev of events.filter(e=>e.logIndex===global&&e.type!=='switch'))applyVisual(ev);renderBattle();await sleep(initial?380:520)}$('narration').classList.add('hidden');actionLocked=!!battle?.submitted;if(!actionLocked&&battle?.status==='playing')renderActions()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showResult(){actionLocked=true;$('actions').classList.add('hidden');$('waiting').classList.add('hidden');const won=battle.winner===role,msg=battle.finishReason==='surrender'?(won?'El rival se rindió.':'Te rendiste.'):(won?'¡Ganaste la batalla!':'Perdiste la batalla.');$('narration').textContent=msg;$('narration').classList.remove('hidden')}
(async()=>{try{$('name').value=localStorage.getItem('ud-alpha-name')||'';const saved=JSON.parse(localStorage.getItem('ud-alpha-team')||'[]');await loadCatalog();team=saved.filter(id=>catalog.entities[id]).slice(0,8);renderRoster();$('homeStatus').textContent=`Contenido ${revision} cargado.`;$('homeStatus').className='status good'}catch(e){$('homeStatus').textContent='Alpha no disponible: '+e.message;$('homeStatus').className='status error';$('create').disabled=$('join').disabled=true}})();
</script></body></html>
