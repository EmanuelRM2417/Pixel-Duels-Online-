<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Duels | Editor</title>

  <style>
    body {
      background: #15151f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      color: #8b7cff;
    }

    .panel {
      background: #242435;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: 30px auto;
    }
  </style>
</head>

<body>
  <h1>Universal Duels</h1>

  <div class="panel">
    <h2>Editor privado</h2>

    <p>Bienvenido al editor de Universal Duels.</p>

    <p>Los cambios se guardarán como borradores.</p>

    <p>El juego público no se modificará automáticamente.</p>

    <label for="draftNotes">Notas del borrador</label>

<br><br>

<textarea
  id="draftNotes"
  rows="6"
  placeholder="Escribí aquí tus cambios..."
  style="width: 100%; box-sizing: border-box;"
></textarea>

<p id="saveStatus">Sin cambios pendientes</p>

<script>
  const notes = document.getElementById("draftNotes");
  const status = document.getElementById("saveStatus");

  let saveTimer;
  let saving = Promise.resolve();

  async function loadDraft() {
    status.textContent = "Cargando borrador...";

    try {
      const response = await fetch("/editor-api/draft");

      if (!response.ok) {
        throw new Error("No se pudo cargar el borrador.");
      }

      const data = await response.json();

      notes.value = data.draft?.notes || "";
      status.textContent = "Borrador cargado.";
    } catch {
      status.textContent = "Error al cargar el borrador.";
    }
  }

  async function saveDraft() {
    const text = notes.value;

    saving = saving.catch(() => {}).then(async () => {
      status.textContent = "Guardando...";

      const response = await fetch("/editor-api/draft", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ notes: text })
      });

      if (!response.ok) {
        throw new Error("No se pudo guardar.");
      }

      status.textContent = "Guardado automáticamente ✓";
    });

    try {
      await saving;
    } catch {
      status.textContent = "Error al guardar. Revisá la conexión.";
    }
  }

  notes.addEventListener("input", () => {
    clearTimeout(saveTimer);
    status.textContent = "Cambios pendientes...";

    saveTimer = setTimeout(saveDraft, 2000);
  });

  loadDraft();
</script>
  </div>
</body>
</html>
