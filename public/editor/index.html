<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Duels | Editor</title>

  <style>
    body {
      background: #15151f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      color: #8b7cff;
    }

    .panel {
      background: #242435;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: 30px auto;
    }
  </style>
</head>

<body>
  <h1>Universal Duels</h1>

  <div class="panel">
    <h2>Editor privado</h2>

    <p>Bienvenido al editor de Universal Duels.</p>

    <p>Los cambios se guardarán como borradores.</p>

    <p>El juego público no se modificará automáticamente.</p>

    <label for="draftNotes">Notas del borrador</label>

<br><br>

<textarea
  id="draftNotes"
  rows="6"
  placeholder="Escribí aquí tus cambios..."
  style="width: 100%; box-sizing: border-box;"
></textarea>

<p id="saveStatus">Sin cambios pendientes</p>

<script>
  const draftNotes = document.getElementById("draftNotes");
  const saveStatus = document.getElementById("saveStatus");

  let saveTimer;

  draftNotes.addEventListener("input", () => {
    clearTimeout(saveTimer);

    saveStatus.textContent = "Cambios pendientes...";

    saveTimer = setTimeout(() => {
      saveStatus.textContent = "Guardado automático pendiente de conectar";
    }, 2000);
  });
</script>
  </div>
</body>
</html>
